<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Bağlanma optik eşiği aşağı kaydırabilir</title><desc id="desc">Hidrojen benzeri eksitonun n=1,2,3 düzeyleri serbest çift eşiğine alttan yaklaşır.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#16324b"/></marker></defs><rect width="960" height="560" fill="#fbfdff"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="48" fill="#16324b" font-size="27" text-anchor="start" font-weight="bold">Bağlanma optik eşiği aşağı kaydırabilir</text><line x1="160" y1="465" x2="160" y2="100" stroke="#16324b" stroke-width="2" marker-end="url(#arrow)"/><text x="120" y="112" fill="#16324b" font-size="22" text-anchor="start" font-weight="normal">Enerji</text><rect x="240" y="100" width="560" height="70" fill="#e3e9ef" opacity="1"/><line x1="240" y1="170" x2="800" y2="170" stroke="#526b7b" stroke-width="3"/><text x="520" y="132" fill="#526b7b" font-size="22" text-anchor="middle" font-weight="normal">Serbest elektron-delik sürekliliği</text><text x="815" y="178" fill="#16324b" font-size="22" text-anchor="start" font-weight="normal">Eg</text><line x1="275" y1="400.0" x2="710" y2="400.0" stroke="#176bb2" stroke-width="3"/><text x="730" y="408.0" fill="#16324b" font-size="21" text-anchor="start" font-weight="normal">n = 1</text><line x1="275" y1="227.5" x2="710" y2="227.5" stroke="#187b66" stroke-width="3"/><text x="730" y="235.5" fill="#16324b" font-size="21" text-anchor="start" font-weight="normal">n = 2</text><line x1="275" y1="195.55555555555554" x2="710" y2="195.55555555555554" stroke="#187b66" stroke-width="3"/><text x="730" y="203.55555555555554" fill="#16324b" font-size="21" text-anchor="start" font-weight="normal">n = 3</text><line x1="210" y1="175" x2="210" y2="395" stroke="#a76a0a" stroke-width="3" marker-end="url(#arrow)"/><text x="185" y="290" fill="#a76a0a" font-size="23" text-anchor="end" font-weight="normal">EB</text><text x="480" y="445" fill="#176bb2" font-size="26" text-anchor="middle" font-weight="normal">Temel eksiton: EX = Eg − EB</text><text x="480" y="505" fill="#16324b" font-size="25" text-anchor="middle" font-weight="normal">Bağlı düzeyler: En = Eg − EB/n²</text><text x="480" y="544" fill="#526b7b" font-size="21" text-anchor="middle" font-weight="normal">Optik şiddetler ayrıca seçim kurallarına bağlıdır.</text></g></svg>
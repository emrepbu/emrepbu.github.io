<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Değişkenle birlikte sınırlar</title><desc id="desc">x sıfırdan ikiye giderken u eşittir bir artı x kare birden beşe gider.</desc><rect width="720" height="480" rx="18" fill="#0d1721"/><g font-family="system-ui,sans-serif" fill="#e4edf6" font-size="19"><text x="32" y="42" font-size="25" font-weight="700">Değişkenle birlikte sınırlar</text><text x="55" y="105" fill="#62d4c8" font-size="24">u = 1 + x²</text><line x1="100" y1="190" x2="620" y2="190" stroke="#33485c" stroke-width="2"/><line x1="100" y1="330" x2="620" y2="330" stroke="#33485c" stroke-width="2"/><circle cx="100" cy="190" r="5" fill="#ffbd69"/><text x="95" y="171" fill="#e4edf6" font-size="19">0</text><circle cx="100" cy="330" r="5" fill="#62d4c8"/><text x="95" y="363" fill="#e4edf6" font-size="19">1</text><line x1="100" y1="205" x2="100" y2="312" stroke="#c397ed" stroke-width="2"/><circle cx="360" cy="190" r="5" fill="#ffbd69"/><text x="355" y="171" fill="#e4edf6" font-size="19">1</text><circle cx="230" cy="330" r="5" fill="#62d4c8"/><text x="225" y="363" fill="#e4edf6" font-size="19">2</text><line x1="360" y1="205" x2="230" y2="312" stroke="#c397ed" stroke-width="2"/><circle cx="620" cy="190" r="5" fill="#ffbd69"/><text x="615" y="171" fill="#e4edf6" font-size="19">2</text><circle cx="620" cy="330" r="5" fill="#62d4c8"/><text x="615" y="363" fill="#e4edf6" font-size="19">5</text><line x1="620" y1="205" x2="620" y2="312" stroke="#c397ed" stroke-width="2"/><text x="50" y="195" fill="#e4edf6" font-size="19">x</text><text x="50" y="335" fill="#e4edf6" font-size="19">u</text><text x="140" y="427" fill="#e4edf6" font-size="23">[0, 2] → [1, 5]; du = 2x dx</text></g></svg>
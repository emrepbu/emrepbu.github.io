<svg xmlns="http://www.w3.org/2000/svg" width="720" height="490" viewBox="0 0 720 490" role="img" aria-labelledby="title desc"><title id="title">Toplamın karesindeki dört alan</title><desc id="desc">a kare ve b kare parçalarına iki ab dikdörtgeni eklenerek büyük karenin alanı elde edilir.</desc><rect width="720" height="490" rx="18" fill="#0d1721"/><g font-family="Arial, Helvetica, sans-serif"><text x="360" y="43" font-size="32" fill="#eef4f5" text-anchor="middle">Toplamın karesi</text><rect x="195" y="100" width="180" height="180" fill="#62dcc3" fill-opacity="0.13" stroke="#62dcc3" stroke-width="3"/><rect x="375" y="100" width="120" height="180" fill="#f4cb75" fill-opacity="0.13" stroke="#f4cb75" stroke-width="3"/><rect x="195" y="280" width="180" height="120" fill="#f4cb75" fill-opacity="0.13" stroke="#f4cb75" stroke-width="3"/><rect x="375" y="280" width="120" height="120" fill="#62dcc3" fill-opacity="0.13" stroke="#62dcc3" stroke-width="3"/><text x="285" y="82" font-size="28" fill="#62dcc3" text-anchor="middle">a</text><text x="435" y="82" font-size="28" fill="#f4cb75" text-anchor="middle">b</text><text x="170" y="197" font-size="28" fill="#62dcc3" text-anchor="middle">a</text><text x="170" y="347" font-size="28" fill="#f4cb75" text-anchor="middle">b</text><text x="285" y="201" font-size="34" fill="#62dcc3" text-anchor="middle">a²</text><text x="435" y="201" font-size="31" fill="#f4cb75" text-anchor="middle">ab</text><text x="285" y="351" font-size="31" fill="#f4cb75" text-anchor="middle">ab</text><text x="435" y="351" font-size="34" fill="#62dcc3" text-anchor="middle">b²</text><text x="360" y="455" font-size="30" fill="#eef4f5" text-anchor="middle">(a + b)² = a² + 2ab + b²</text></g></svg>

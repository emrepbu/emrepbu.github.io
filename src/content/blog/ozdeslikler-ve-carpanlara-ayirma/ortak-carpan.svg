<svg xmlns="http://www.w3.org/2000/svg" width="720" height="485" viewBox="0 0 720 485" role="img" aria-labelledby="title desc"><title id="title">Ortak çarpanın alan modeli</title><desc id="desc">Dört metre genişliğindeki üç ve iki metrelik parçalar, yirmi metrekarelik tek dikdörtgen oluşturur.</desc><rect width="720" height="485" rx="18" fill="#0d1721"/><g font-family="Arial, Helvetica, sans-serif"><text x="360" y="48" font-size="32" fill="#eef4f5" text-anchor="middle">Bir alan, iki hesap</text><rect x="160" y="105" width="240" height="240" fill="#62dcc3" fill-opacity="0.13" stroke="#62dcc3" stroke-width="3"/><rect x="400" y="105" width="160" height="240" fill="#f4cb75" fill-opacity="0.13" stroke="#f4cb75" stroke-width="3"/><text x="280" y="85" font-size="27" fill="#62dcc3" text-anchor="middle">3 m</text><text x="480" y="85" font-size="27" fill="#f4cb75" text-anchor="middle">2 m</text><text x="99" y="237" font-size="27" fill="#eef4f5" text-anchor="middle">4 m</text><text x="280" y="228" font-size="32" fill="#62dcc3" text-anchor="middle">12 m²</text><text x="480" y="228" font-size="32" fill="#f4cb75" text-anchor="middle">8 m²</text><text x="360" y="406" font-size="27" fill="#eef4f5" text-anchor="middle">4 × 3 + 4 × 2 = 4 × (3 + 2)</text><text x="360" y="454" font-size="28" fill="#eef4f5" text-anchor="middle">12 + 8 = 20 m²</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Uca eklemek: (3, 1) + (1, 2)</title><desc id="desc">İlk okun ucuna eklenen ikinci ok başlangıçtan 4,3 noktasına ulaştırır.</desc><rect width="720" height="480" rx="20" fill="#0d1721"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><g font-family="Arial, sans-serif" fill="#eef4f5"><text x="30" y="40" font-size="25" fill="#eef4f5" text-anchor="start">Uca eklemek: (3, 1) + (1, 2)</text><line x1="84.500" y1="380.000" x2="535.000" y2="380.000" stroke="#97aaba" stroke-width="2" marker-end="url(#arrow)"/><line x1="110.000" y1="405.500" x2="110.000" y2="65.500" stroke="#97aaba" stroke-width="2" marker-end="url(#arrow)"/><text x="191" y="410" font-size="18" fill="#97aaba" text-anchor="start">1</text><text x="276" y="410" font-size="18" fill="#97aaba" text-anchor="start">2</text><text x="361" y="410" font-size="18" fill="#97aaba" text-anchor="start">3</text><text x="446" y="410" font-size="18" fill="#97aaba" text-anchor="start">4</text><text x="80" y="300" font-size="18" fill="#97aaba" text-anchor="start">1</text><text x="80" y="215" font-size="18" fill="#97aaba" text-anchor="start">2</text><text x="80" y="130" font-size="18" fill="#97aaba" text-anchor="start">3</text><line x1="110.000" y1="380.000" x2="365.000" y2="295.000" stroke="#62dcc3" stroke-width="5" marker-end="url(#arrow)"/><line x1="365.000" y1="295.000" x2="450.000" y2="125.000" stroke="#f4cb75" stroke-width="5" marker-end="url(#arrow)"/><line x1="110.000" y1="380.000" x2="450.000" y2="125.000" stroke="#eef4f5" stroke-width="3" marker-end="url(#arrow)"/><text x="242" y="367" font-size="22" fill="#62dcc3" text-anchor="start">u = (3, 1)</text><text x="465" y="232" font-size="22" fill="#f4cb75" text-anchor="start">v = (1, 2)</text><text x="220" y="172" font-size="24" fill="#eef4f5" text-anchor="start">u + v = (4, 3)</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Yol ile yer değiştirme farklıdır</title><desc id="desc">3 birim doğu ve 4 birim kuzey hareketinde yol 7, yer değiştirme uzunluğu 5 olur.</desc><rect width="720" height="480" rx="20" fill="#0d1721"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><g font-family="Arial, sans-serif" fill="#eef4f5"><text x="30" y="40" font-size="25" fill="#eef4f5" text-anchor="start">Yol ile yer değiştirme farklıdır</text><line x1="120.000" y1="385.000" x2="330.000" y2="385.000" stroke="#62dcc3" stroke-width="5" marker-end="url(#arrow)"/><line x1="330.000" y1="385.000" x2="330.000" y2="105.000" stroke="#f4cb75" stroke-width="5" marker-end="url(#arrow)"/><line x1="120.000" y1="385.000" x2="330.000" y2="105.000" stroke="#eef4f5" stroke-width="4" marker-end="url(#arrow)"/><text x="200" y="425" font-size="23" fill="#62dcc3" text-anchor="start">3 birim</text><text x="350" y="250" font-size="23" fill="#f4cb75" text-anchor="start">4 birim</text><text x="150" y="245" font-size="23" fill="#eef4f5" text-anchor="start">5 birim</text><text x="440" y="150" font-size="25" fill="#62dcc3" text-anchor="start">Alınan yol: 7</text><text x="440" y="205" font-size="22" fill="#eef4f5" text-anchor="start">Yer değiştirme:</text><text x="440" y="240" font-size="29" fill="#eef4f5" text-anchor="start">(3, 4)</text><text x="440" y="285" font-size="24" fill="#eef4f5" text-anchor="start">Uzunluğu: 5</text></g></svg>
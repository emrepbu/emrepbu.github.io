<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Bir yükseklik, iki dik üçgen</title><desc id="desc">A açısı 60 derece, komşu kenarları 4 ve 6 olan üçgenin yüksekliği gösteriliyor.</desc><rect width="720" height="480" rx="20" fill="#0d1721"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><g font-family="Arial, sans-serif" fill="#eef4f5"><text x="30" y="40" font-size="25" fill="#eef4f5" text-anchor="start">Bir yükseklik, iki dik üçgen</text><polygon points="90.000,375.000 498.000,375.000 226.000,139.441" stroke="#62dcc3" fill="none" stroke-width="3"/><line x1="226.000" y1="139.441" x2="226.000" y2="375.000" stroke="#f4cb75" stroke-width="3" stroke-dasharray="7 6"/><polygon points="226.000,375.000 239.600,375.000 239.600,361.400 226.000,361.400" stroke="#f4cb75" fill="none" stroke-width="1"/><text x="66" y="405" font-size="23" fill="#eef4f5" text-anchor="start">A</text><text x="510" y="400" font-size="23" fill="#eef4f5" text-anchor="start">B</text><text x="226" y="123.44109017063269" font-size="23" fill="#eef4f5" text-anchor="start">C</text><text x="220" y="405" font-size="23" fill="#eef4f5" text-anchor="start">D</text><text x="92" y="245" font-size="22" fill="#62dcc3" text-anchor="start">b = 4</text><text x="350" y="225" font-size="22" fill="#62dcc3" text-anchor="start">a = √28</text><text x="340" y="435" font-size="22" fill="#62dcc3" text-anchor="start">c = 6</text><text x="250" y="295" font-size="22" fill="#f4cb75" text-anchor="start">h = 2√3</text><text x="125" y="355" font-size="21" fill="#f4cb75" text-anchor="start">60°</text></g></svg>
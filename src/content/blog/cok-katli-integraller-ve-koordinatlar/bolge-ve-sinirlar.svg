<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Aynı üçgen, iki toplama sırası</title><desc id="desc">Düşey ve yatay kesitlerin farklı iç sınırları aynı üçgeni doldurur.</desc><rect width="720" height="480" rx="18" fill="#0d1721"/><g font-family="system-ui,sans-serif" fill="#e4edf6" font-size="19"><text x="32" y="42" font-size="25" font-weight="700">Aynı üçgen, iki toplama sırası</text><polygon points="120,390 430,390 430,120" fill="#62d4c8" fill-opacity=".2" stroke="#62d4c8" stroke-width="3"/><line x1="90" y1="390" x2="650" y2="390" stroke="#33485c" stroke-width="2"/><line x1="120" y1="95" x2="120" y2="420" stroke="#33485c" stroke-width="2"/><line x1="321.5" y1="390" x2="321.5" y2="214.5" stroke="#ffbd69" stroke-width="5"/><line x1="228.5" y1="295.5" x2="430" y2="295.5" stroke="#c397ed" stroke-width="5"/><text x="450" y="160" fill="#e4edf6" font-size="19">y = x</text><text x="470" y="215" fill="#ffbd69" font-size="18">Düşey: 0 ≤ y ≤ x</text><text x="445" y="315" fill="#c397ed" font-size="18">Yatay: y ≤ x ≤ 1</text><text x="114" y="420" fill="#e4edf6" font-size="19">0</text><text x="425" y="420" fill="#e4edf6" font-size="19">1</text></g></svg>
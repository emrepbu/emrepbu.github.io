<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Katsayıları eşitleyerek yok etme</title><desc id="desc">İlk denklem üçle çarpılır. İkinci denklem çıkarılınca y terimleri yok olur ve beş x eşittir yedi kalır.</desc><rect width="720" height="480" rx="18" fill="#0d1721"/><g font-family="Arial, Helvetica, sans-serif"><text x="360" y="44" font-size="31" fill="#eef4f5" text-anchor="middle">Bir değişkeni yok etmek</text><text x="360" y="107" font-size="32" fill="#62dcc3" text-anchor="middle">2x + y = 4</text><text x="620" y="107" font-size="26" fill="#f4cb75" text-anchor="middle">× 3</text><text x="360" y="171" font-size="34" fill="#62dcc3" text-anchor="middle">6x + 3y = 12</text><text x="99" y="232" font-size="39" fill="#f4cb75" text-anchor="middle">−</text><text x="360" y="232" font-size="34" fill="#f4cb75" text-anchor="middle">x + 3y = 5</text><line x1="150" y1="255" x2="590" y2="255" stroke="#eef4f5" stroke-width="3"/><text x="360" y="309" font-size="34" fill="#eef4f5" text-anchor="middle">5x + 0y = 7</text><text x="360" y="371" font-size="34" fill="#62dcc3" text-anchor="middle">x = 7/5</text><text x="360" y="438" font-size="27" fill="#eef4f5" text-anchor="middle">İlk denkleme dön: y = 6/5</text></g></svg>

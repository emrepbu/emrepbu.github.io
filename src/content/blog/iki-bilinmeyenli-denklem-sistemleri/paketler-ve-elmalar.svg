<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Tekli ve ikili elma paketleri</title><desc id="desc">Üç tekli ve dört ikili paket toplam yedi paket ve on bir elma içerir.</desc><rect width="720" height="480" rx="18" fill="#0d1721"/><g font-family="Arial, Helvetica, sans-serif"><text x="360" y="45" font-size="31" fill="#eef4f5" text-anchor="middle">Aynı alışverişi iki kez say</text><rect x="62" y="115" width="72" height="130" fill="#62dcc3" fill-opacity="0.13" stroke="#62dcc3" stroke-width="3"/><circle cx="98" cy="157" r="15" stroke="#62dcc3" stroke-width="3" fill="#62dcc3"/><rect x="148" y="115" width="72" height="130" fill="#62dcc3" fill-opacity="0.13" stroke="#62dcc3" stroke-width="3"/><circle cx="184" cy="157" r="15" stroke="#62dcc3" stroke-width="3" fill="#62dcc3"/><rect x="234" y="115" width="72" height="130" fill="#62dcc3" fill-opacity="0.13" stroke="#62dcc3" stroke-width="3"/><circle cx="270" cy="157" r="15" stroke="#62dcc3" stroke-width="3" fill="#62dcc3"/><rect x="320" y="115" width="72" height="130" fill="#f4cb75" fill-opacity="0.13" stroke="#f4cb75" stroke-width="3"/><circle cx="356" cy="157" r="15" stroke="#f4cb75" stroke-width="3" fill="#f4cb75"/><circle cx="356" cy="207" r="15" stroke="#f4cb75" stroke-width="3" fill="#f4cb75"/><rect x="406" y="115" width="72" height="130" fill="#f4cb75" fill-opacity="0.13" stroke="#f4cb75" stroke-width="3"/><circle cx="442" cy="157" r="15" stroke="#f4cb75" stroke-width="3" fill="#f4cb75"/><circle cx="442" cy="207" r="15" stroke="#f4cb75" stroke-width="3" fill="#f4cb75"/><rect x="492" y="115" width="72" height="130" fill="#f4cb75" fill-opacity="0.13" stroke="#f4cb75" stroke-width="3"/><circle cx="528" cy="157" r="15" stroke="#f4cb75" stroke-width="3" fill="#f4cb75"/><circle cx="528" cy="207" r="15" stroke="#f4cb75" stroke-width="3" fill="#f4cb75"/><rect x="578" y="115" width="72" height="130" fill="#f4cb75" fill-opacity="0.13" stroke="#f4cb75" stroke-width="3"/><circle cx="614" cy="157" r="15" stroke="#f4cb75" stroke-width="3" fill="#f4cb75"/><circle cx="614" cy="207" r="15" stroke="#f4cb75" stroke-width="3" fill="#f4cb75"/><text x="191" y="292" font-size="29" fill="#62dcc3" text-anchor="middle">3 tekli</text><text x="488" y="292" font-size="29" fill="#f4cb75" text-anchor="middle">4 ikili</text><text x="360" y="355" font-size="31" fill="#eef4f5" text-anchor="middle">Paket: 3 + 4 = 7</text><text x="360" y="417" font-size="31" fill="#eef4f5" text-anchor="middle">Elma: 3 + 2 × 4 = 11</text></g></svg>

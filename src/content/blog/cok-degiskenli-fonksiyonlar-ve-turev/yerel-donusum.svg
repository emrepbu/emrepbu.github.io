<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Yerel doğrusal dönüşüm</title><desc id="desc">Küçük bir girdi karesi doğrusal dönüşüm altında paralelkenara dönüşür; şematik Jacobian gösterimi.</desc><rect width="720" height="480" rx="18" fill="#0d1721"/><g font-family="system-ui,sans-serif" fill="#e4edf6" font-size="19"><text x="32" y="42" font-size="25" font-weight="700">Yerel doğrusal dönüşüm</text><text x="70" y="92" fill="#e4edf6" font-size="19">Girdi değişimi</text><text x="408" y="92" fill="#e4edf6" font-size="19">Çıktı değişimi</text><line x1="80" y1="380" x2="300" y2="380" stroke="#33485c" stroke-width="2"/><line x1="80" y1="150" x2="80" y2="390" stroke="#33485c" stroke-width="2"/><line x1="405" y1="380" x2="660" y2="380" stroke="#33485c" stroke-width="2"/><line x1="405" y1="130" x2="405" y2="390" stroke="#33485c" stroke-width="2"/><polygon points="80,380 160,380 160,300 80,300" fill="#62d4c8" fill-opacity=".22" stroke="#62d4c8" stroke-width="2"/><polygon points="465,350 555,305 510,215 420,260" fill="#ffbd69" fill-opacity=".22" stroke="#ffbd69" stroke-width="2"/><text x="155" y="440" fill="#e4edf6" font-size="20">Yerel değişim ≈ Jacobian × girdi değişimi</text><text x="332" y="255" fill="#e4edf6" font-size="30">→</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="515" viewBox="0 0 720 515" role="img" aria-labelledby="title desc"><title id="title">Üçgenin açı toplamının paralellik ispatı</title><desc id="desc">C noktasından AB tabanına paralel m doğrusu çizilir. İç ters açı kopyaları ile tepe açısı aynı doğru açıyı doldurur.</desc><rect width="720" height="515" rx="18" fill="#0d1721"/><g font-family="Arial, Helvetica, sans-serif"><text x="360" y="45" font-size="31" fill="#eef4f5" text-anchor="middle">Paralellikten açı toplamına</text><line x1="60" y1="150" x2="660" y2="150" stroke="#62dcc3" stroke-width="3"/><polygon points="150,390 560,390 320,150" stroke="#eef4f5" stroke-width="3" fill="#eef4f5" fill-opacity="0.025"/><text x="150" y="429" font-size="27" fill="#eef4f5" text-anchor="middle">A</text><text x="560" y="429" font-size="27" fill="#eef4f5" text-anchor="middle">B</text><text x="320" y="123" font-size="27" fill="#eef4f5" text-anchor="middle">C</text><text x="618" y="131" font-size="26" fill="#62dcc3" text-anchor="middle">m</text><text x="190" y="371" font-size="29" fill="#62dcc3" text-anchor="middle">α</text><text x="514" y="371" font-size="29" fill="#f4cb75" text-anchor="middle">β</text><text x="271" y="181" font-size="28" fill="#62dcc3" text-anchor="middle">α</text><text x="374" y="178" font-size="28" fill="#f4cb75" text-anchor="middle">β</text><text x="320" y="222" font-size="28" fill="#eef4f5" text-anchor="middle">γ</text><text x="107" y="146" font-size="24" fill="#62dcc3" text-anchor="middle">››</text><text x="431" y="386" font-size="24" fill="#62dcc3" text-anchor="middle">››</text><text x="360" y="478" font-size="28" fill="#eef4f5" text-anchor="middle">m ∥ AB  →  α + γ + β = 180°</text></g></svg>

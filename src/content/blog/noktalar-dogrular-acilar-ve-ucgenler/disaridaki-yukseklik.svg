<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Geniş açılı üçgende dış yükseklik</title><desc id="desc">C noktasından AB doğrusuna inen dikme, A noktasının solundaki H noktasına ulaşır.</desc><rect width="720" height="480" rx="18" fill="#0d1721"/><g font-family="Arial, Helvetica, sans-serif"><text x="360" y="44" font-size="27" fill="#eef4f5" text-anchor="middle">Yükseklik tabanı taşıyan doğruya iner</text><polygon points="170,350 590,350 90,120" stroke="#62dcc3" stroke-width="3" fill="#62dcc3" fill-opacity="0.09"/><line x1="50" y1="350" x2="170" y2="350" stroke="#9eb0be" stroke-width="3" stroke-dasharray="7 7"/><line x1="90" y1="120" x2="90" y2="350" stroke="#f4cb75" stroke-width="4" stroke-dasharray="8 7"/><line x1="90" y1="332" x2="108" y2="332" stroke="#f4cb75" stroke-width="3"/><line x1="108" y1="332" x2="108" y2="350" stroke="#f4cb75" stroke-width="3"/><text x="168" y="389" font-size="27" fill="#eef4f5" text-anchor="middle">A</text><text x="592" y="389" font-size="27" fill="#eef4f5" text-anchor="middle">B</text><text x="81" y="98" font-size="27" fill="#eef4f5" text-anchor="middle">C</text><text x="71" y="389" font-size="27" fill="#f4cb75" text-anchor="middle">H</text><text x="62" y="240" font-size="29" fill="#f4cb75" text-anchor="middle">h</text><text x="360" y="437" font-size="27" fill="#eef4f5" text-anchor="middle">CH ⟂ AB; H, kenarın uzantısında.</text></g></svg>

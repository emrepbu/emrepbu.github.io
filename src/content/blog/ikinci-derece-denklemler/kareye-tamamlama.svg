<svg xmlns="http://www.w3.org/2000/svg" width="720" height="530" viewBox="0 0 720 530" role="img" aria-labelledby="title desc"><title id="title">Kareye tamamlama alan modeli</title><desc id="desc">x kare ve iki adet iki x şeridinin boş köşesi dört alanlı kareyle tamamlanır. Çizim pozitif x için şematiktir.</desc><rect width="720" height="530" rx="18" fill="#0d1721"/><g font-family="Arial, Helvetica, sans-serif"><text x="360" y="43" font-size="30" fill="#eef4f5" text-anchor="middle">Eksik köşe: 2 × 2 = 4</text><rect x="160" y="100" width="240" height="240" fill="#62dcc3" fill-opacity="0.13" stroke="#62dcc3" stroke-width="3"/><rect x="400" y="100" width="100" height="240" fill="#f4cb75" fill-opacity="0.13" stroke="#f4cb75" stroke-width="3"/><rect x="160" y="340" width="240" height="100" fill="#f4cb75" fill-opacity="0.13" stroke="#f4cb75" stroke-width="3"/><rect x="400" y="340" width="100" height="100" fill="#eef4f5" fill-opacity="0.08" stroke="#eef4f5" stroke-width="3"/><text x="280" y="83" font-size="26" fill="#62dcc3" text-anchor="middle">x</text><text x="450" y="83" font-size="26" fill="#f4cb75" text-anchor="middle">2</text><text x="132" y="226" font-size="26" fill="#62dcc3" text-anchor="middle">x</text><text x="132" y="399" font-size="26" fill="#f4cb75" text-anchor="middle">2</text><text x="280" y="232" font-size="35" fill="#62dcc3" text-anchor="middle">x²</text><text x="450" y="232" font-size="30" fill="#f4cb75" text-anchor="middle">2x</text><text x="280" y="403" font-size="30" fill="#f4cb75" text-anchor="middle">2x</text><text x="450" y="403" font-size="35" fill="#eef4f5" text-anchor="middle">4</text><text x="360" y="493" font-size="29" fill="#eef4f5" text-anchor="middle">x² + 4x + 4 = (x + 2)²</text></g></svg>

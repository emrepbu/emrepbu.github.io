<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Sıfır çarpım ilkesi ve uzunluk koşulu</title><desc id="desc">Çarpanlar iki gerçek kök verir. Uzunluk pozitif olduğu için pano modelinde yalnızca dört kabul edilir.</desc><rect width="720" height="480" rx="18" fill="#0d1721"/><g font-family="Arial, Helvetica, sans-serif"><text x="360" y="46" font-size="27" fill="#eef4f5" text-anchor="middle">Çarpım sıfırsa en az bir çarpan sıfır</text><text x="360" y="113" font-size="35" fill="#eef4f5" text-anchor="middle">(x + 7)(x − 4) = 0</text><line x1="295" y1="145" x2="170" y2="210" stroke="#62dcc3" stroke-width="3"/><line x1="425" y1="145" x2="550" y2="210" stroke="#f4cb75" stroke-width="3"/><rect x="55" y="220" width="265" height="95" fill="#62dcc3" fill-opacity="0.13" stroke="#62dcc3" stroke-width="3"/><text x="187" y="262" font-size="30" fill="#62dcc3" text-anchor="middle">x + 7 = 0</text><text x="187" y="302" font-size="28" fill="#62dcc3" text-anchor="middle">x = −7</text><rect x="400" y="220" width="265" height="95" fill="#f4cb75" fill-opacity="0.13" stroke="#f4cb75" stroke-width="3"/><text x="532" y="262" font-size="30" fill="#f4cb75" text-anchor="middle">x − 4 = 0</text><text x="532" y="302" font-size="28" fill="#f4cb75" text-anchor="middle">x = 4</text><text x="360" y="370" font-size="29" fill="#eef4f5" text-anchor="middle">Denklemde iki gerçek kök</text><text x="360" y="427" font-size="27" fill="#eef4f5" text-anchor="middle">Pano kenarında: x &gt; 0 → x = 4</text></g></svg>

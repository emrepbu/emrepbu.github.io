<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Düzleme dik uzaklık</title><desc id="desc">P noktasından düzleme dik ayak Q ya olan uzaklık şematik olarak gösterilir.</desc><rect width="720" height="480" rx="18" fill="#0d1721"/><g font-family="system-ui,sans-serif" fill="#e4edf6" font-size="19"><text x="32" y="42" font-size="25" font-weight="700">Düzleme dik uzaklık</text><polygon points="110,330 475,280 625,365 260,415" fill="#62d4c8" fill-opacity=".18" stroke="#62d4c8" stroke-width="2"/><line x1="370" y1="330" x2="370" y2="115" stroke="#ffbd69" stroke-width="4"/><circle cx="370" cy="115" r="5" fill="#ffbd69"/><circle cx="370" cy="330" r="5" fill="#ffbd69"/><line x1="370" y1="115" x2="530" y2="350" stroke="#33485c" stroke-width="2"/><text x="388" y="117" fill="#e4edf6" font-size="19">P</text><text x="385" y="336" fill="#e4edf6" font-size="19">Q: dik ayak</text><text x="280" y="229" fill="#ffbd69" font-size="25">d</text><text x="473" y="304" fill="#62d4c8" font-size="19">Düzlem</text><text x="160" y="455" fill="#e4edf6" font-size="19">En kısa yol normal doğrultusundadır.</text></g></svg>
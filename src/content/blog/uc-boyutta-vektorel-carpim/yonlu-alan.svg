<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Alanı yönle birlikte taşımak</title><desc id="desc">İki düzlem vektörünün paralelkenarı ve sağ el yönelimindeki dik alan vektörü izdüşümle gösterilir.</desc><rect width="720" height="480" rx="18" fill="#0d1721"/><g font-family="system-ui,sans-serif" fill="#e4edf6" font-size="19"><text x="32" y="42" font-size="25" font-weight="700">Alanı yönle birlikte taşımak</text><polygon points="250,350 490,260 380,210 140,300" fill="#62d4c8" fill-opacity=".22" stroke="#62d4c8" stroke-width="2"/><path d="M250.000,350.000 L490.000,260.000" fill="none" stroke="#62d4c8" stroke-width="3"/><path d="M250.000,350.000 L140.000,300.000" fill="none" stroke="#ffbd69" stroke-width="3"/><path d="M250.000,350.000 L250.000,170.000" fill="none" stroke="#c397ed" stroke-width="5"/><text x="499" y="260" fill="#e4edf6" font-size="19">a</text><text x="114" y="300" fill="#e4edf6" font-size="19">b</text><text x="262" y="170" fill="#c397ed" font-size="19">a × b</text><text x="400" y="410" fill="#e4edf6" font-size="19">Alan = |a × b|</text></g></svg>
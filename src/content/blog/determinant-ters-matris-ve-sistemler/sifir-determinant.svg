<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Bir yön kaybolunca alan sıfır olur</title><desc id="desc">2,0 ve 0,1 ölçeklemesi dikdörtgen üretir. 0,0 ve 0,1 sütunları şekli doğruya çökertir.</desc><rect width="720" height="480" rx="20" fill="#0d1721"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><g font-family="Arial, sans-serif" fill="#eef4f5"><text x="30" y="40" font-size="25" fill="#eef4f5" text-anchor="start">Bir yön kaybolunca alan sıfır olur</text><line x1="41.500" y1="350.000" x2="336.000" y2="350.000" stroke="#97aaba" stroke-width="2" marker-end="url(#arrow)"/><line x1="70.000" y1="378.500" x2="70.000" y2="112.500" stroke="#97aaba" stroke-width="2" marker-end="url(#arrow)"/><polygon points="70.000,350.000 260.000,350.000 260.000,255.000 70.000,255.000" stroke="#62dcc3" fill="#153d3b" stroke-width="3"/><text x="140" y="410" font-size="27" fill="#62dcc3" text-anchor="middle">det = 2</text><line x1="451.500" y1="350.000" x2="665.000" y2="350.000" stroke="#97aaba" stroke-width="2" marker-end="url(#arrow)"/><line x1="480.000" y1="378.500" x2="480.000" y2="112.500" stroke="#97aaba" stroke-width="2" marker-end="url(#arrow)"/><line x1="480.000" y1="350.000" x2="480.000" y2="255.000" stroke="#f4cb75" stroke-width="7"/><text x="550" y="410" font-size="27" fill="#f4cb75" text-anchor="middle">det = 0</text><text x="340" y="310" font-size="35" fill="#eef4f5" text-anchor="middle">→</text><text x="360" y="95" font-size="27" fill="#eef4f5" text-anchor="start">Yatay ölçek: 2 → 0</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Determinant: yönlü alan ölçeği</title><desc id="desc">2,1 ve 1,2 sütunları alanı 3 olan paralelkenar oluşturur.</desc><rect width="720" height="480" rx="20" fill="#0d1721"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><g font-family="Arial, sans-serif" fill="#eef4f5"><text x="30" y="40" font-size="25" fill="#eef4f5" text-anchor="start">Determinant: yönlü alan ölçeği</text><line x1="59.500" y1="375.000" x2="399.500" y2="375.000" stroke="#97aaba" stroke-width="2" marker-end="url(#arrow)"/><line x1="85.000" y1="400.500" x2="85.000" y2="60.500" stroke="#97aaba" stroke-width="2" marker-end="url(#arrow)"/><polygon points="85.000,375.000 255.000,290.000 340.000,120.000 170.000,205.000" stroke="#62dcc3" fill="#153d3b" stroke-width="3"/><line x1="85.000" y1="375.000" x2="255.000" y2="290.000" stroke="#f4cb75" stroke-width="5" marker-end="url(#arrow)"/><line x1="85.000" y1="375.000" x2="170.000" y2="205.000" stroke="#62dcc3" stroke-width="5" marker-end="url(#arrow)"/><text x="250" y="335" font-size="22" fill="#f4cb75" text-anchor="start">(2, 1)</text><text x="120" y="178" font-size="22" fill="#62dcc3" text-anchor="start">(1, 2)</text><text x="425" y="170" font-size="23" fill="#eef4f5" text-anchor="start">A = [ 2  1 ; 1  2 ]</text><text x="425" y="230" font-size="25" fill="#f4cb75" text-anchor="start">det A = 4 − 1</text><text x="425" y="276" font-size="32" fill="#f4cb75" text-anchor="start">= 3</text><text x="425" y="338" font-size="22" fill="#eef4f5" text-anchor="start">Alan: 3 birim²</text></g></svg>
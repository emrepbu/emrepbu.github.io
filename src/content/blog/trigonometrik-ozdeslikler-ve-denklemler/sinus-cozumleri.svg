<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Aynı yükseklik, iki açı</title><desc id="desc">Birim çemberde sinüsü bir bölü iki olan noktalar 30 ve 150 derecededir.</desc><rect width="720" height="480" rx="20" fill="#0d1721"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><g font-family="Arial, sans-serif" fill="#eef4f5"><text x="30" y="40" font-size="25" fill="#eef4f5" text-anchor="start">Aynı yükseklik, iki açı</text><line x1="80.000" y1="250.000" x2="485.000" y2="250.000" stroke="#97aaba" stroke-width="2" marker-end="url(#arrow)"/><line x1="275.000" y1="422.500" x2="275.000" y2="70.000" stroke="#97aaba" stroke-width="2" marker-end="url(#arrow)"/><circle cx="275" cy="250" r="150" fill="none" stroke="#97aaba" stroke-width="2"/><line x1="95.000" y1="175.000" x2="455.000" y2="175.000" stroke="#f4cb75" stroke-width="2" stroke-dasharray="7 6"/><line x1="275.000" y1="250.000" x2="404.904" y2="175.000" stroke="#62dcc3" stroke-width="4"/><circle cx="404.9038105676658" cy="175.0" r="6" fill="#62dcc3" stroke="#62dcc3" stroke-width="2"/><text x="422.9038105676658" y="160.0" font-size="24" fill="#62dcc3" text-anchor="start">π/6</text><line x1="275.000" y1="250.000" x2="145.096" y2="175.000" stroke="#62dcc3" stroke-width="4"/><circle cx="145.0961894323342" cy="175.0" r="6" fill="#62dcc3" stroke="#62dcc3" stroke-width="2"/><text x="85.0961894323342" y="160.0" font-size="24" fill="#62dcc3" text-anchor="start">5π/6</text><text x="480" y="180" font-size="24" fill="#f4cb75" text-anchor="start">y = 1/2</text><text x="515" y="235" font-size="21" fill="#eef4f5" text-anchor="start">Her tam turda</text><text x="515" y="265" font-size="21" fill="#eef4f5" text-anchor="start">yeniden:</text><text x="515" y="310" font-size="29" fill="#62dcc3" text-anchor="start">+ 2kπ</text><text x="515" y="346" font-size="18" fill="#eef4f5" text-anchor="start">k bir tam sayı</text></g></svg>
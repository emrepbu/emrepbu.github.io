<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc"><title id="title">Sıra değişince sonuç değişir</title><desc id="desc">f girdiye bir ekler, g girdiyi ikiyle çarpar. Üç girdisi iki sırada sekiz ve yedi sonuçlarını verir.</desc><rect width="720" height="520" rx="20" fill="#0d1721"/><g font-family="Arial, sans-serif"><text x="360" y="44" font-size="27" fill="#eef4f5" text-anchor="middle">Sıra değişince sonuç değişir</text><text x="70" y="155" font-size="32" fill="#62dcc3" text-anchor="middle">3</text><text x="210" y="155" font-size="32" fill="#f4cb75" text-anchor="middle">+ 1</text><text x="350" y="155" font-size="32" fill="#62dcc3" text-anchor="middle">4</text><text x="490" y="155" font-size="32" fill="#f4cb75" text-anchor="middle">× 2</text><text x="640" y="155" font-size="32" fill="#62dcc3" text-anchor="middle">8</text><text x="130" y="155" font-size="28" fill="#eef4f5" text-anchor="middle">→</text><text x="280" y="155" font-size="28" fill="#eef4f5" text-anchor="middle">→</text><text x="415" y="155" font-size="28" fill="#eef4f5" text-anchor="middle">→</text><text x="570" y="155" font-size="28" fill="#eef4f5" text-anchor="middle">→</text><text x="70" y="325" font-size="32" fill="#62dcc3" text-anchor="middle">3</text><text x="210" y="325" font-size="32" fill="#f4cb75" text-anchor="middle">× 2</text><text x="350" y="325" font-size="32" fill="#62dcc3" text-anchor="middle">6</text><text x="490" y="325" font-size="32" fill="#f4cb75" text-anchor="middle">+ 1</text><text x="640" y="325" font-size="32" fill="#62dcc3" text-anchor="middle">7</text><text x="130" y="325" font-size="28" fill="#eef4f5" text-anchor="middle">→</text><text x="280" y="325" font-size="28" fill="#eef4f5" text-anchor="middle">→</text><text x="415" y="325" font-size="28" fill="#eef4f5" text-anchor="middle">→</text><text x="570" y="325" font-size="28" fill="#eef4f5" text-anchor="middle">→</text><text x="360" y="95" font-size="25" fill="#eef4f5" text-anchor="middle">Önce f, sonra g</text><text x="360" y="265" font-size="25" fill="#eef4f5" text-anchor="middle">Önce g, sonra f</text><text x="360" y="439" font-size="28" fill="#62dcc3" text-anchor="middle">g(f(x)) = 2x + 2</text><text x="360" y="482" font-size="28" fill="#f4cb75" text-anchor="middle">f(g(x)) = 2x + 1</text></g></svg>
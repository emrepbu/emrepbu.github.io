<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Direnç hem malzemeye hem geometriye bağlıdır</title><desc id="desc">Şematik iki telde uzunluğun ve alanın aynı oranda artması direnci değiştirmez.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#16324b"/></marker></defs><rect width="960" height="560" fill="#fbfdff"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="48" fill="#16324b" font-size="27" text-anchor="start" font-weight="bold">Direnç hem malzemeye hem geometriye bağlıdır</text><text x="90" y="115" fill="#16324b" font-size="24" text-anchor="start" font-weight="normal">Aynı malzeme: özdirenç ρ sabit</text><rect x="120" y="165" width="280" height="45" fill="#c8deee" opacity="1"/><line x1="120" y1="165" x2="400" y2="165" stroke="#176bb2" stroke-width="3"/><line x1="120" y1="210" x2="400" y2="210" stroke="#176bb2" stroke-width="3"/><text x="260" y="150" fill="#176bb2" font-size="22" text-anchor="middle" font-weight="normal">Uzunluk ℓ</text><text x="440" y="194" fill="#176bb2" font-size="22" text-anchor="start" font-weight="normal">Kesit alanı A</text><text x="725" y="194" fill="#16324b" font-size="24" text-anchor="start" font-weight="normal">R = ρℓ/A</text><rect x="120" y="300" width="560" height="90" fill="#d9eee7" opacity="1"/><line x1="120" y1="300" x2="680" y2="300" stroke="#187b66" stroke-width="3"/><line x1="120" y1="390" x2="680" y2="390" stroke="#187b66" stroke-width="3"/><text x="400" y="283" fill="#187b66" font-size="22" text-anchor="middle" font-weight="normal">Uzunluk 2ℓ</text><text x="710" y="350" fill="#187b66" font-size="22" text-anchor="start" font-weight="normal">Alan 2A</text><text x="480" y="460" fill="#16324b" font-size="28" text-anchor="middle" font-weight="normal">R₂ = ρ(2ℓ)/(2A) = R₁</text><text x="480" y="520" fill="#526b7b" font-size="22" text-anchor="middle" font-weight="normal">Uzunluk iki kat, kesit alanı iki kat → direnç aynı</text></g></svg>
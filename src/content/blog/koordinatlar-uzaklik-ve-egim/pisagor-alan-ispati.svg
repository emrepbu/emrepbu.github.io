<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc"><title id="title">Dört üçgen ve ortadaki kare</title><desc id="desc">Dört eş dik üçgenin hipotenüsleri iç karenin kenarlarıdır. Alanlar karşılaştırılınca a kare artı b kare eşittir c kare çıkar.</desc><rect width="720" height="520" rx="20" fill="#0d1721"/><g font-family="Arial, sans-serif"><text x="360" y="44" font-size="27" fill="#eef4f5" text-anchor="middle">Dört üçgen ve ortadaki kare</text><polygon points="185,102 479,102 479,396 185,396" fill="#eef4f5" fill-opacity="0" stroke="#eef4f5" stroke-width="3"/><polygon points="185,102 311,102 185,270" fill="#62dcc3" fill-opacity="0.15" stroke="#62dcc3" stroke-width="3"/><polygon points="311,102 479,102 479,228" fill="#62dcc3" fill-opacity="0.15" stroke="#62dcc3" stroke-width="3"/><polygon points="479,228 479,396 353,396" fill="#62dcc3" fill-opacity="0.15" stroke="#62dcc3" stroke-width="3"/><polygon points="353,396 185,396 185,270" fill="#62dcc3" fill-opacity="0.15" stroke="#62dcc3" stroke-width="3"/><polygon points="311,102 479,228 353,396 185,270" fill="#f4cb75" fill-opacity="0.15" stroke="#f4cb75" stroke-width="3"/><text x="332" y="265" font-size="38" fill="#f4cb75" text-anchor="middle">c²</text><text x="360" y="461" font-size="29" fill="#eef4f5" text-anchor="middle">(a + b)² = 4 × ab/2 + c²</text><text x="125" y="252" font-size="22" fill="#eef4f5" text-anchor="middle">a + b</text><text x="332" y="84" font-size="22" fill="#eef4f5" text-anchor="middle">a + b</text></g></svg>
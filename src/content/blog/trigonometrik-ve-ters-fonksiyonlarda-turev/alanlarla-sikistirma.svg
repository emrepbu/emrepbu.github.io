<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Alanlardan sinüs limitine</title><desc id="desc">İç üçgen, daire dilimi ve teğet üçgeni alanları karşılaştırılır.</desc><rect width="720" height="480" rx="18" fill="#0d1721"/><g font-family="system-ui,sans-serif" fill="#e4edf6" font-size="19"><text x="32" y="42" font-size="25" font-weight="700">Alanlardan sinüs limitine</text><path d="M120,350 L360,350 A240,240 0 0 0 311.0601116517734,204.75526262335052 Z" fill="#62d4c8" fill-opacity=".18" stroke="#62d4c8" stroke-width="3"/><polygon points="120,350 360,350 360,167.55094420791772" fill="#ffbd69" fill-opacity=".12" stroke="#ffbd69" stroke-width="2"/><polygon points="120,350 360,350 311.0601116517734,204.75526262335052" fill="#c397ed" fill-opacity=".3" stroke="#c397ed" stroke-width="2"/><text x="94" y="377" fill="#e4edf6" font-size="19">O</text><text x="365" y="377" fill="#e4edf6" font-size="19">A</text><text x="287.0601116517734" y="192.75526262335052" fill="#e4edf6" font-size="19">B</text><text x="370" y="167.55094420791772" fill="#e4edf6" font-size="19">T</text><text x="179" y="335" fill="#e4edf6" font-size="19">h</text><text x="420" y="180" fill="#e4edf6" font-size="19">İç üçgen: sin h / 2</text><text x="420" y="230" fill="#e4edf6" font-size="19">Dilim: h / 2</text><text x="420" y="280" fill="#e4edf6" font-size="19">Dış üçgen: tan h / 2</text><text x="100" y="435" fill="#e4edf6" font-size="19">0 &lt; h &lt; π/2; açı radyan cinsinden</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="title desc">
<title id="title">Üçte birden dörtte üçü çıkarmak</title>
<desc id="desc">Sayı doğrusunda her küçük aralık on ikide birdir. Dört bölü on iki noktasından sola doğru dokuz aralık ilerleyen ok, eksi beş bölü on iki noktasında biter.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" role="img" aria-labelledby="title desc">
<title id="title">Üçte iki ile dörtte biri on ikide birlik parçalarla toplamak</title>
<desc id="desc">Üç çerçeve de bir metre uzunluğundadır. İlkinde sekiz on ikide birlik parça, ikincisinde üç parça boyalıdır. Son çerçevede sekiz yeşil ve üç turuncu parça toplam on bir on ikide birlik uzunluk oluşturur.</desc>

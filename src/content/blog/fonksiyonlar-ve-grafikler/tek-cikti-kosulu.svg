<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc"><title id="title">Fonksiyonun koşulu girdide aranır</title><desc id="desc">Soldaki üç girdinin her birinin tek çıktısı vardır. Sağdaki 2 girdisi b ve c olmak üzere iki çıktıyla eşleşir.</desc><rect width="720" height="520" rx="20" fill="#0d1721"/><g font-family="Arial, sans-serif"><text x="360" y="44" font-size="27" fill="#eef4f5" text-anchor="middle">Fonksiyonun koşulu girdide aranır</text><text x="185" y="98" font-size="24" fill="#62dcc3" text-anchor="middle">Tek çıktı: fonksiyon</text><text x="535" y="98" font-size="23" fill="#f4cb75" text-anchor="middle">İki çıktı: fonksiyon değil</text><circle cx="85" cy="170" r="26" fill="#0d1721" stroke="#eef4f5" stroke-width="3"/><text x="85" y="178" font-size="25" fill="#eef4f5" text-anchor="middle">1</text><circle cx="85" cy="260" r="26" fill="#0d1721" stroke="#eef4f5" stroke-width="3"/><text x="85" y="268" font-size="25" fill="#eef4f5" text-anchor="middle">2</text><circle cx="85" cy="350" r="26" fill="#0d1721" stroke="#eef4f5" stroke-width="3"/><text x="85" y="358" font-size="25" fill="#eef4f5" text-anchor="middle">3</text><circle cx="285" cy="170" r="26" fill="#0d1721" stroke="#eef4f5" stroke-width="3"/><text x="285" y="178" font-size="25" fill="#eef4f5" text-anchor="middle">a</text><circle cx="285" cy="260" r="26" fill="#0d1721" stroke="#eef4f5" stroke-width="3"/><text x="285" y="268" font-size="25" fill="#eef4f5" text-anchor="middle">b</text><circle cx="285" cy="350" r="26" fill="#0d1721" stroke="#eef4f5" stroke-width="3"/><text x="285" y="358" font-size="25" fill="#eef4f5" text-anchor="middle">c</text><circle cx="435" cy="170" r="26" fill="#0d1721" stroke="#eef4f5" stroke-width="3"/><text x="435" y="178" font-size="25" fill="#eef4f5" text-anchor="middle">1</text><circle cx="435" cy="260" r="26" fill="#0d1721" stroke="#eef4f5" stroke-width="3"/><text x="435" y="268" font-size="25" fill="#eef4f5" text-anchor="middle">2</text><circle cx="435" cy="350" r="26" fill="#0d1721" stroke="#eef4f5" stroke-width="3"/><text x="435" y="358" font-size="25" fill="#eef4f5" text-anchor="middle">3</text><circle cx="635" cy="170" r="26" fill="#0d1721" stroke="#eef4f5" stroke-width="3"/><text x="635" y="178" font-size="25" fill="#eef4f5" text-anchor="middle">a</text><circle cx="635" cy="260" r="26" fill="#0d1721" stroke="#eef4f5" stroke-width="3"/><text x="635" y="268" font-size="25" fill="#eef4f5" text-anchor="middle">b</text><circle cx="635" cy="350" r="26" fill="#0d1721" stroke="#eef4f5" stroke-width="3"/><text x="635" y="358" font-size="25" fill="#eef4f5" text-anchor="middle">c</text><line x1="112" y1="170" x2="257" y2="170" stroke="#62dcc3" stroke-width="3"/><line x1="112" y1="260" x2="257" y2="170" stroke="#62dcc3" stroke-width="3"/><line x1="112" y1="350" x2="257" y2="350" stroke="#62dcc3" stroke-width="3"/><line x1="462" y1="170" x2="607" y2="170" stroke="#f4cb75" stroke-width="3"/><line x1="462" y1="260" x2="607" y2="260" stroke="#f4cb75" stroke-width="3"/><line x1="462" y1="260" x2="607" y2="350" stroke="#f4cb75" stroke-width="3"/><line x1="462" y1="350" x2="607" y2="350" stroke="#f4cb75" stroke-width="3"/><text x="360" y="431" font-size="25" fill="#eef4f5" text-anchor="middle">Farklı girdiler aynı çıktıya gidebilir.</text><text x="360" y="469" font-size="25" fill="#eef4f5" text-anchor="middle">Bir girdi iki ayrı çıktıya gidemez.</text></g></svg>
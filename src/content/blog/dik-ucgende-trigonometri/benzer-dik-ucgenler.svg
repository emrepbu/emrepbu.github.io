<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc"><title id="title">Aynı açı, aynı kenar oranları</title><desc id="desc">İki dik üçgenin kenarları üç dört beş ve altı sekiz on. Ölçek iki olsa da karşı kenarın hipotenüse oranı üç bölü beştir.</desc><rect width="720" height="520" rx="20" fill="#0d1721"/><g font-family="Arial, sans-serif"><text x="360" y="44" font-size="27" fill="#eef4f5" text-anchor="middle">Aynı açı, aynı kenar oranları</text><polygon points="70,310 210,310 210,205" fill="#62dcc3" fill-opacity="0.15" stroke="#62dcc3" stroke-width="3"/><polygon points="345,340 625,340 625,130" fill="#62dcc3" fill-opacity="0.15" stroke="#62dcc3" stroke-width="3"/><text x="150" y="347" font-size="26" fill="#eef4f5" text-anchor="middle">4</text><text x="233" y="264" font-size="26" fill="#eef4f5" text-anchor="middle">3</text><text x="140" y="233" font-size="26" fill="#f4cb75" text-anchor="middle">5</text><text x="480" y="377" font-size="26" fill="#eef4f5" text-anchor="middle">8</text><text x="647" y="243" font-size="26" fill="#eef4f5" text-anchor="middle">6</text><text x="465" y="214" font-size="26" fill="#f4cb75" text-anchor="middle">10</text><text x="96" y="298" font-size="24" fill="#f4cb75" text-anchor="middle">θ</text><text x="373" y="326" font-size="24" fill="#f4cb75" text-anchor="middle">θ</text><text x="360" y="445" font-size="31" fill="#62dcc3" text-anchor="middle">sin θ = 3/5 = 6/10</text><text x="360" y="486" font-size="23" fill="#eef4f5" text-anchor="middle">Şekil büyür, karşı / hipotenüs oranı korunur.</text><line x1="198" y1="310" x2="198" y2="298" stroke="#eef4f5" stroke-width="2"/><line x1="198" y1="298" x2="210" y2="298" stroke="#eef4f5" stroke-width="2"/><line x1="613" y1="340" x2="613" y2="328" stroke="#eef4f5" stroke-width="2"/><line x1="613" y1="328" x2="625" y2="328" stroke="#eef4f5" stroke-width="2"/></g></svg>
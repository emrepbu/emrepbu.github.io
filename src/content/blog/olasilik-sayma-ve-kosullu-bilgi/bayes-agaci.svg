<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Bayes için doğal sıklık ağacı</title><desc id="desc">Kusurlu ve kusursuz gruplardan 90 ve 495 işaretli ürün gelir; koşullu pay 90 bölü 585 tir.</desc><rect width="720" height="480" rx="18" fill="#0d1721"/><g font-family="system-ui,sans-serif" fill="#e4edf6" font-size="19"><text x="32" y="42" font-size="25" font-weight="700">Bayes için doğal sıklık ağacı</text><text x="38" y="96" fill="#e4edf6" font-size="24">10.000 ürün</text><line x1="120" y1="125" x2="285" y2="180" stroke="#33485c" stroke-width="2"/><line x1="120" y1="125" x2="285" y2="320" stroke="#33485c" stroke-width="2"/><text x="300" y="179" fill="#ffbd69" font-size="22">100 kusurlu</text><text x="300" y="319" fill="#62d4c8" font-size="22">9.900 kusursuz</text><line x1="390" y1="190" x2="490" y2="222" stroke="#33485c" stroke-width="2"/><line x1="390" y1="328" x2="490" y2="360" stroke="#33485c" stroke-width="2"/><text x="500" y="229" fill="#ffbd69" font-size="22">90 işaretli</text><text x="500" y="367" fill="#62d4c8" font-size="22">495 işaretli</text><text x="115" y="435" fill="#e4edf6" font-size="22">İşaretli grupta kusurlu: 90 / 585 ≈ %15,38</text><text x="57" y="263" fill="#e4edf6" font-size="18">Model sayımları</text></g></svg>
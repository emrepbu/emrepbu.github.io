<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">İki başarının altı konumu</title><desc id="desc">Dört denemede tam iki başarı için altı farklı konum seçimi renkli noktalarla gösterilir.</desc><rect width="720" height="480" rx="18" fill="#0d1721"/><g font-family="system-ui,sans-serif" fill="#e4edf6" font-size="19"><text x="32" y="42" font-size="25" font-weight="700">İki başarının altı konumu</text><text x="53" y="100" fill="#e4edf6" font-size="22">4 konumdan 2 başarı konumu seçilir.</text><circle cx="86" cy="190" r="13" fill="#62d4c8"/><circle cx="126" cy="190" r="13" fill="#62d4c8"/><circle cx="166" cy="190" r="13" fill="#33485c"/><circle cx="206" cy="190" r="13" fill="#33485c"/><circle cx="301" cy="190" r="13" fill="#62d4c8"/><circle cx="341" cy="190" r="13" fill="#33485c"/><circle cx="381" cy="190" r="13" fill="#62d4c8"/><circle cx="421" cy="190" r="13" fill="#33485c"/><circle cx="516" cy="190" r="13" fill="#62d4c8"/><circle cx="556" cy="190" r="13" fill="#33485c"/><circle cx="596" cy="190" r="13" fill="#33485c"/><circle cx="636" cy="190" r="13" fill="#62d4c8"/><circle cx="86" cy="310" r="13" fill="#33485c"/><circle cx="126" cy="310" r="13" fill="#62d4c8"/><circle cx="166" cy="310" r="13" fill="#62d4c8"/><circle cx="206" cy="310" r="13" fill="#33485c"/><circle cx="301" cy="310" r="13" fill="#33485c"/><circle cx="341" cy="310" r="13" fill="#62d4c8"/><circle cx="381" cy="310" r="13" fill="#33485c"/><circle cx="421" cy="310" r="13" fill="#62d4c8"/><circle cx="516" cy="310" r="13" fill="#33485c"/><circle cx="556" cy="310" r="13" fill="#33485c"/><circle cx="596" cy="310" r="13" fill="#62d4c8"/><circle cx="636" cy="310" r="13" fill="#62d4c8"/><text x="250" y="420" fill="#e4edf6" font-size="27">C(4, 2) = 6</text></g></svg>
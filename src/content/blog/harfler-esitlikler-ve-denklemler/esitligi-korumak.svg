<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Eşitliğin korunması</title><desc id="desc">İki x ve üç birim on bir birime eşittir. İki taraftan üç çıkarılınca iki x sekiz birime eşit kalır.</desc><rect width="720" height="480" rx="18" fill="#0d1721"/><g font-family="Arial, Helvetica, sans-serif"><text x="360" y="48" font-size="30" fill="#eef4f5" text-anchor="middle">Aynı miktarı iki taraftan çıkar</text><rect x="70" y="100" width="110" height="80" fill="#62dcc3" fill-opacity="0.13" stroke="#62dcc3" stroke-width="3"/><text x="125" y="151" font-size="34" fill="#62dcc3" text-anchor="middle">x</text><rect x="195" y="100" width="110" height="80" fill="#62dcc3" fill-opacity="0.13" stroke="#62dcc3" stroke-width="3"/><text x="250" y="151" font-size="34" fill="#62dcc3" text-anchor="middle">x</text><text x="344" y="151" font-size="30" fill="#f4cb75" text-anchor="middle">+ 3</text><text x="425" y="151" font-size="36" fill="#eef4f5" text-anchor="middle">=</text><rect x="470" y="100" width="175" height="80" fill="#f4cb75" fill-opacity="0.13" stroke="#f4cb75" stroke-width="3"/><text x="557" y="151" font-size="34" fill="#f4cb75" text-anchor="middle">11</text><text x="265" y="235" font-size="30" fill="#f4cb75" text-anchor="middle">− 3</text><text x="558" y="235" font-size="30" fill="#f4cb75" text-anchor="middle">− 3</text><line x1="80" y1="260" x2="640" y2="260" stroke="#9eb0be" stroke-width="3"/><text x="235" y="327" font-size="38" fill="#62dcc3" text-anchor="middle">2x</text><text x="425" y="327" font-size="36" fill="#eef4f5" text-anchor="middle">=</text><text x="558" y="327" font-size="38" fill="#f4cb75" text-anchor="middle">8</text><text x="360" y="409" font-size="31" fill="#eef4f5" text-anchor="middle">İki eş pay: x = 4</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-labelledby="title desc"><title id="title">İşlemlerin sırasını geri almak</title><desc id="desc">İleri yönde ikiyle çarpıp üç ekliyoruz. Geri yönde üç çıkarıp ikiye bölüyoruz.</desc><rect width="720" height="430" rx="18" fill="#0d1721"/><g font-family="Arial, Helvetica, sans-serif"><text x="360" y="50" font-size="31" fill="#eef4f5" text-anchor="middle">İşlem yolu ve geri dönüş</text><rect x="60" y="95" width="150" height="80" fill="#62dcc3" fill-opacity="0.13" stroke="#62dcc3" stroke-width="3"/><text x="135" y="146" font-size="31" fill="#62dcc3" text-anchor="middle">x</text><rect x="280" y="95" width="150" height="80" fill="#62dcc3" fill-opacity="0.13" stroke="#62dcc3" stroke-width="3"/><text x="355" y="146" font-size="31" fill="#62dcc3" text-anchor="middle">2x</text><rect x="510" y="95" width="150" height="80" fill="#f4cb75" fill-opacity="0.13" stroke="#f4cb75" stroke-width="3"/><text x="585" y="146" font-size="31" fill="#f4cb75" text-anchor="middle">2x + 3</text><text x="244" y="135" font-size="24" fill="#eef4f5" text-anchor="middle">× 2</text><text x="474" y="135" font-size="24" fill="#eef4f5" text-anchor="middle">+ 3</text><text x="360" y="235" font-size="38" fill="#eef4f5" text-anchor="middle">4 → 8 → 11</text><text x="360" y="320" font-size="38" fill="#f4cb75" text-anchor="middle">11 → 8 → 4</text><text x="360" y="379" font-size="28" fill="#eef4f5" text-anchor="middle">Geri dönüş: önce −3, sonra ÷2</text></g></svg>

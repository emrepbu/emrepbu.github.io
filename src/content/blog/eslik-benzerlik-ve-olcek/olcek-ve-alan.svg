<svg xmlns="http://www.w3.org/2000/svg" width="720" height="510" viewBox="0 0 720 510" role="img" aria-labelledby="title desc"><title id="title">Benzer üçgenlerde uzunluk ve alan ölçeği</title><desc id="desc">Üç dört beş üçgeni iki kat büyütülerek altı sekiz on üçgeni olur. Alan altıdan yirmi dörde çıkar.</desc><rect width="720" height="510" rx="18" fill="#0d1721"/><g font-family="Arial, Helvetica, sans-serif"><text x="360" y="44" font-size="30" fill="#eef4f5" text-anchor="middle">Uzunluk oranı 2, alan oranı 4</text><polygon points="60,325 180,325 60,235" stroke="#62dcc3" stroke-width="3" fill="#62dcc3" fill-opacity="0.13"/><polygon points="345,325 585,325 345,145" stroke="#f4cb75" stroke-width="3" fill="#f4cb75" fill-opacity="0.13"/><line x1="60" y1="310" x2="75" y2="310" stroke="#62dcc3" stroke-width="3"/><line x1="75" y1="310" x2="75" y2="325" stroke="#62dcc3" stroke-width="3"/><line x1="345" y1="309" x2="361" y2="309" stroke="#f4cb75" stroke-width="3"/><line x1="361" y1="309" x2="361" y2="325" stroke="#f4cb75" stroke-width="3"/><text x="119" y="361" font-size="28" fill="#62dcc3" text-anchor="middle">4</text><text x="34" y="284" font-size="28" fill="#62dcc3" text-anchor="middle">3</text><text x="132" y="265" font-size="28" fill="#62dcc3" text-anchor="middle">5</text><text x="465" y="361" font-size="28" fill="#f4cb75" text-anchor="middle">8</text><text x="317" y="243" font-size="28" fill="#f4cb75" text-anchor="middle">6</text><text x="477" y="220" font-size="28" fill="#f4cb75" text-anchor="middle">10</text><text x="120" y="412" font-size="28" fill="#62dcc3" text-anchor="middle">Alan: 6</text><text x="465" y="412" font-size="28" fill="#f4cb75" text-anchor="middle">Alan: 24</text><text x="360" y="469" font-size="27" fill="#eef4f5" text-anchor="middle">Çevre: 12 → 24    Alan: 6 → 24</text></g></svg>

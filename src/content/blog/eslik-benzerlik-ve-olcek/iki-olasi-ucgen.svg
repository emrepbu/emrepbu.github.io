<svg xmlns="http://www.w3.org/2000/svg" width="720" height="515" viewBox="0 0 720 515" role="img" aria-labelledby="title desc"><title id="title">İki kenar ve arada olmayan açı belirsizliği</title><desc id="desc">Aynı A açısı ve ortak AC kenarıyla, C den eşit uzaklıktaki B1 ve B2 iki farklı üçgen oluşturur.</desc><rect width="720" height="515" rx="18" fill="#0d1721"/><g font-family="Arial, Helvetica, sans-serif"><text x="360" y="43" font-size="29" fill="#eef4f5" text-anchor="middle">Aynı iki kenar ve aynı A açısı</text><polygon points="80,355 170,355 320,175" stroke="#62dcc3" stroke-width="3" fill="#62dcc3" fill-opacity="0.1"/><polygon points="80,355 470,355 320,175" stroke="#f4cb75" stroke-width="3" fill="#f4cb75" fill-opacity="0.04"/><line x1="70" y1="355" x2="635" y2="355" stroke="#eef4f5" stroke-width="3"/><line x1="320" y1="175" x2="170" y2="355" stroke="#62dcc3" stroke-width="4"/><line x1="320" y1="175" x2="470" y2="355" stroke="#f4cb75" stroke-width="4"/><line x1="320" y1="175" x2="320" y2="355" stroke="#9eb0be" stroke-width="2" stroke-dasharray="7 7"/><text x="70" y="394" font-size="26" fill="#eef4f5" text-anchor="middle">A</text><text x="170" y="394" font-size="26" fill="#62dcc3" text-anchor="middle">B₁</text><text x="470" y="394" font-size="26" fill="#f4cb75" text-anchor="middle">B₂</text><text x="320" y="147" font-size="26" fill="#eef4f5" text-anchor="middle">C</text><text x="320" y="394" font-size="24" fill="#9eb0be" text-anchor="middle">H</text><text x="158" y="337" font-size="28" fill="#eef4f5" text-anchor="middle">α</text><line x1="239" y1="274" x2="251" y2="264" stroke="#62dcc3" stroke-width="4"/><line x1="390" y1="264" x2="402" y2="274" stroke="#f4cb75" stroke-width="4"/><text x="360" y="441" font-size="27" fill="#eef4f5" text-anchor="middle">CB₁ = CB₂; AC ortak; AB₁ ≠ AB₂</text><text x="360" y="481" font-size="22" fill="#9eb0be" text-anchor="middle">Verilen açı iki verilen kenarın arasında değil.</text></g></svg>

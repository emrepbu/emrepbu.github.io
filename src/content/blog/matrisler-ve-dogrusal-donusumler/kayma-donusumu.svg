<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Yatay kayma: (x, y) → (x + y, y)</title><desc id="desc">Birim karenin yatay kenarları değişmez, üst kenarı sağa bir birim kayar.</desc><rect width="720" height="480" rx="20" fill="#0d1721"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><g font-family="Arial, sans-serif" fill="#eef4f5"><text x="30" y="40" font-size="25" fill="#eef4f5" text-anchor="start">Yatay kayma: (x, y) → (x + y, y)</text><line x1="60.000" y1="350.000" x2="320.000" y2="350.000" stroke="#97aaba" stroke-width="2" marker-end="url(#arrow)"/><line x1="80.000" y1="370.000" x2="80.000" y2="140.000" stroke="#97aaba" stroke-width="2" marker-end="url(#arrow)"/><polygon points="80.000,350.000 180.000,350.000 180.000,250.000 80.000,250.000" stroke="#62dcc3" fill="#153d3b" stroke-width="3"/><text x="160" y="415" font-size="23" fill="#eef4f5" text-anchor="middle">Birim kare</text><line x1="400.000" y1="350.000" x2="660.000" y2="350.000" stroke="#97aaba" stroke-width="2" marker-end="url(#arrow)"/><line x1="420.000" y1="370.000" x2="420.000" y2="140.000" stroke="#97aaba" stroke-width="2" marker-end="url(#arrow)"/><polygon points="420.000,350.000 520.000,350.000 620.000,250.000 520.000,250.000" stroke="#62dcc3" fill="#153d3b" stroke-width="3"/><text x="500" y="415" font-size="23" fill="#eef4f5" text-anchor="middle">Kaymış kare</text><text x="335" y="275" font-size="36" fill="#f4cb75" text-anchor="middle">→</text><text x="360" y="95" font-size="25" fill="#62dcc3" text-anchor="middle">S = [ 1  1 ; 0  1 ]</text></g></svg>
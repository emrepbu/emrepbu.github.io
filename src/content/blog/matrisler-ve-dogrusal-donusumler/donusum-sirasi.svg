<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Dönüşüm sırası sonucu değiştirir</title><desc id="desc">1,1 önce yatay iki kat büyütülüp kaydırılırsa 3,1; önce kaydırılıp büyütülürse 4,1 olur.</desc><rect width="720" height="480" rx="20" fill="#0d1721"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><g font-family="Arial, sans-serif" fill="#eef4f5"><text x="30" y="40" font-size="25" fill="#eef4f5" text-anchor="start">Dönüşüm sırası sonucu değiştirir</text><text x="115" y="200" font-size="30" fill="#eef4f5" text-anchor="middle">(1, 1)</text><text x="360" y="200" font-size="30" fill="#eef4f5" text-anchor="middle">(2, 1)</text><text x="605" y="200" font-size="30" fill="#62dcc3" text-anchor="middle">(3, 1)</text><line x1="187.000" y1="190.000" x2="283.000" y2="190.000" stroke="#f4cb75" stroke-width="3" marker-end="url(#arrow)"/><text x="235" y="165" font-size="24" fill="#f4cb75" text-anchor="middle">D</text><line x1="432.000" y1="190.000" x2="528.000" y2="190.000" stroke="#f4cb75" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="165" font-size="24" fill="#f4cb75" text-anchor="middle">S</text><text x="115" y="350" font-size="30" fill="#eef4f5" text-anchor="middle">(1, 1)</text><text x="360" y="350" font-size="30" fill="#eef4f5" text-anchor="middle">(2, 1)</text><text x="605" y="350" font-size="30" fill="#62dcc3" text-anchor="middle">(4, 1)</text><line x1="187.000" y1="340.000" x2="283.000" y2="340.000" stroke="#f4cb75" stroke-width="3" marker-end="url(#arrow)"/><text x="235" y="315" font-size="24" fill="#f4cb75" text-anchor="middle">S</text><line x1="432.000" y1="340.000" x2="528.000" y2="340.000" stroke="#f4cb75" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="315" font-size="24" fill="#f4cb75" text-anchor="middle">D</text><text x="35" y="94" font-size="22" fill="#eef4f5" text-anchor="start">D(x, y) = (2x, y)    S(x, y) = (x + y, y)</text><text x="360" y="440" font-size="28" fill="#f4cb75" text-anchor="middle">SD ≠ DS</text></g></svg>
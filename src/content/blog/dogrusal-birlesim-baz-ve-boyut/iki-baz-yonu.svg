<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Aynı vektör, farklı koordinatlar</title><desc id="desc">1,0 ve 1,1 bazında katsayılar 1 ve 2 iken standart koordinatlar 3 ve 2 olur.</desc><rect width="720" height="480" rx="20" fill="#0d1721"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><g font-family="Arial, sans-serif" fill="#eef4f5"><text x="30" y="40" font-size="25" fill="#eef4f5" text-anchor="start">Aynı vektör, farklı koordinatlar</text><line x1="83.000" y1="360.000" x2="560.000" y2="360.000" stroke="#97aaba" stroke-width="2" marker-end="url(#arrow)"/><line x1="110.000" y1="387.000" x2="110.000" y2="90.000" stroke="#97aaba" stroke-width="2" marker-end="url(#arrow)"/><line x1="110.000" y1="360.000" x2="200.000" y2="360.000" stroke="#62dcc3" stroke-width="5" marker-end="url(#arrow)"/><line x1="200.000" y1="360.000" x2="290.000" y2="270.000" stroke="#f4cb75" stroke-width="5" marker-end="url(#arrow)"/><line x1="290.000" y1="270.000" x2="380.000" y2="180.000" stroke="#f4cb75" stroke-width="5" marker-end="url(#arrow)"/><line x1="110.000" y1="360.000" x2="380.000" y2="180.000" stroke="#eef4f5" stroke-width="3" marker-end="url(#arrow)"/><text x="120" y="398" font-size="22" fill="#62dcc3" text-anchor="start">1 · b₁</text><text x="270" y="328" font-size="24" fill="#f4cb75" text-anchor="start">b₂</text><text x="345" y="250" font-size="24" fill="#f4cb75" text-anchor="start">b₂</text><text x="395" y="173" font-size="24" fill="#eef4f5" text-anchor="start">v = (3, 2)</text><text x="395" y="210" font-size="23" fill="#62dcc3" text-anchor="start">[v]B = (1, 2)</text><text x="40" y="445" font-size="24" fill="#eef4f5" text-anchor="start">b₁ = (1, 0)      b₂ = (1, 1)</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Dikdörtgenlerden birikime</title><desc id="desc">Sekiz sağ uç dikdörtgeni y eşittir x eğrisinin alanını yukarıdan yaklaştırır.</desc><rect width="720" height="480" rx="18" fill="#0d1721"/><g font-family="system-ui,sans-serif" fill="#e4edf6" font-size="19"><text x="32" y="42" font-size="25" font-weight="700">Dikdörtgenlerden birikime</text><line x1="80" y1="390" x2="650" y2="390" stroke="#33485c" stroke-width="2"/><line x1="80" y1="95" x2="80" y2="390" stroke="#33485c" stroke-width="2"/><rect x="80.0" y="355.0" width="67.5" height="35.0" fill="#ffbd69" fill-opacity=".18" stroke="#ffbd69"/><rect x="147.5" y="320.0" width="67.5" height="70.0" fill="#ffbd69" fill-opacity=".18" stroke="#ffbd69"/><rect x="215.0" y="285.0" width="67.5" height="105.0" fill="#ffbd69" fill-opacity=".18" stroke="#ffbd69"/><rect x="282.5" y="250.0" width="67.5" height="140.0" fill="#ffbd69" fill-opacity=".18" stroke="#ffbd69"/><rect x="350.0" y="215.0" width="67.5" height="175.0" fill="#ffbd69" fill-opacity=".18" stroke="#ffbd69"/><rect x="417.5" y="180.0" width="67.5" height="210.0" fill="#ffbd69" fill-opacity=".18" stroke="#ffbd69"/><rect x="485.0" y="145.0" width="67.5" height="245.0" fill="#ffbd69" fill-opacity=".18" stroke="#ffbd69"/><rect x="552.5" y="110.0" width="67.5" height="280.0" fill="#ffbd69" fill-opacity=".18" stroke="#ffbd69"/><path d="M80.000,390.000 L620.000,110.000" fill="none" stroke="#62d4c8" stroke-width="3"/><text x="94" y="90" fill="#62d4c8" font-size="19">f(x) = x</text><text x="375" y="105" fill="#e4edf6" font-size="19">n = 8; sağ toplam 2,25</text><text x="96" y="440" fill="#e4edf6" font-size="19">Gerçek birikim: 2; parça genişliği: 0,25</text></g></svg>
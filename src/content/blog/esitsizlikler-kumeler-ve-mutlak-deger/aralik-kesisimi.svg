<svg xmlns="http://www.w3.org/2000/svg" width="720" height="495" viewBox="0 0 720 495" role="img" aria-labelledby="title desc"><title id="title">İki aralığın kesişimi</title><desc id="desc">İki dahil daha büyük sayılar ile altıdan küçük sayıların ortak kısmı iki dahil altı hariç aralığıdır.</desc><rect width="720" height="495" rx="18" fill="#0d1721"/><g font-family="Arial, Helvetica, sans-serif"><text x="360" y="43" font-size="31" fill="#eef4f5" text-anchor="middle">İki koşulun ortak kısmı</text><text x="360" y="99" font-size="27" fill="#62dcc3" text-anchor="middle">x ≥ 2</text><line x1="70" y1="135" x2="650" y2="135" stroke="#9eb0be" stroke-width="3"/><line x1="220" y1="135" x2="625" y2="135" stroke="#62dcc3" stroke-width="8"/><circle cx="220" cy="135" r="8" stroke="#62dcc3" stroke-width="3" fill="#62dcc3"/><text x="220" y="172" font-size="23" fill="#eef4f5" text-anchor="middle">2</text><text x="460" y="172" font-size="23" fill="#eef4f5" text-anchor="middle">6</text><text x="360" y="219" font-size="27" fill="#f4cb75" text-anchor="middle">x &lt; 6</text><line x1="70" y1="255" x2="650" y2="255" stroke="#9eb0be" stroke-width="3"/><line x1="70" y1="255" x2="460" y2="255" stroke="#f4cb75" stroke-width="8"/><circle cx="460" cy="255" r="8" stroke="#f4cb75" stroke-width="3" fill="#0d1721"/><text x="220" y="292" font-size="23" fill="#eef4f5" text-anchor="middle">2</text><text x="460" y="292" font-size="23" fill="#eef4f5" text-anchor="middle">6</text><text x="360" y="339" font-size="27" fill="#62dcc3" text-anchor="middle">2 ≤ x &lt; 6</text><line x1="70" y1="375" x2="650" y2="375" stroke="#9eb0be" stroke-width="3"/><line x1="220" y1="375" x2="460" y2="375" stroke="#62dcc3" stroke-width="8"/><circle cx="220" cy="375" r="8" stroke="#62dcc3" stroke-width="3" fill="#62dcc3"/><circle cx="460" cy="375" r="8" stroke="#62dcc3" stroke-width="3" fill="#0d1721"/><text x="220" y="412" font-size="23" fill="#eef4f5" text-anchor="middle">2</text><text x="460" y="412" font-size="23" fill="#eef4f5" text-anchor="middle">6</text><text x="360" y="459" font-size="27" fill="#eef4f5" text-anchor="middle">[2, ∞) ∩ (−∞, 6) = [2, 6)</text><polygon points="638,135 620,123 620,147" fill="#62dcc3"/><polygon points="58,255 77,243 77,267" fill="#f4cb75"/></g></svg>

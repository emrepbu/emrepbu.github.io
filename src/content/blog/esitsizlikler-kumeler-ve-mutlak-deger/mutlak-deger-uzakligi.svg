<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Mutlak değer ve merkeze uzaklık</title><desc id="desc">Eksi bir ve beş, iki merkezinin iki yanında üçer birim uzaktadır.</desc><rect width="720" height="480" rx="18" fill="#0d1721"/><g font-family="Arial, Helvetica, sans-serif"><text x="360" y="45" font-size="32" fill="#eef4f5" text-anchor="middle">Merkez 2, uzaklık 3</text><line x1="60" y1="220" x2="660" y2="220" stroke="#9eb0be" stroke-width="3"/><circle cx="180" cy="220" r="8" stroke="#62dcc3" stroke-width="3" fill="#62dcc3"/><text x="180" y="264" font-size="28" fill="#62dcc3" text-anchor="middle">−1</text><circle cx="360" cy="220" r="8" stroke="#eef4f5" stroke-width="3" fill="#eef4f5"/><text x="360" y="264" font-size="28" fill="#eef4f5" text-anchor="middle">2</text><circle cx="540" cy="220" r="8" stroke="#f4cb75" stroke-width="3" fill="#f4cb75"/><text x="540" y="264" font-size="28" fill="#f4cb75" text-anchor="middle">5</text><line x1="180" y1="150" x2="360" y2="150" stroke="#62dcc3" stroke-width="4"/><line x1="360" y1="150" x2="540" y2="150" stroke="#f4cb75" stroke-width="4"/><text x="270" y="131" font-size="27" fill="#62dcc3" text-anchor="middle">3 birim</text><text x="450" y="131" font-size="27" fill="#f4cb75" text-anchor="middle">3 birim</text><text x="360" y="327" font-size="34" fill="#eef4f5" text-anchor="middle">|x − 2| = 3</text><text x="360" y="384" font-size="29" fill="#eef4f5" text-anchor="middle">x = −1 veya x = 5</text><text x="360" y="443" font-size="27" fill="#eef4f5" text-anchor="middle">|x − 2| ≤ 3  →  [−1, 5]</text></g></svg>

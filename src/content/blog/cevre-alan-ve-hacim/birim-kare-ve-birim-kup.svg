<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc"><title id="title">Ölçülen büyüklük birimi belirler</title><desc id="desc">Solda altı birim kare, sağda 3, 2 ve 4 santimetrelik dikdörtgenler prizması.</desc><rect width="720" height="520" rx="20" fill="#0d1721"/><g font-family="Arial, sans-serif"><text x="360" y="44" font-size="27" fill="#eef4f5" text-anchor="middle">Ölçülen büyüklük birimi belirler</text><polygon points="100,125 340,125 340,305 100,305" fill="#62dcc3" fill-opacity="0.15" stroke="#62dcc3" stroke-width="3"/><line x1="100" y1="215" x2="340" y2="215" stroke="#304452" stroke-width="2"/><line x1="180" y1="125" x2="180" y2="305" stroke="#304452" stroke-width="2"/><line x1="260" y1="125" x2="260" y2="305" stroke="#304452" stroke-width="2"/><text x="220" y="102" font-size="25" fill="#eef4f5" text-anchor="middle">3 cm</text><text x="60" y="220" font-size="22" fill="#eef4f5" text-anchor="middle">2 cm</text><text x="220" y="356" font-size="25" fill="#62dcc3" text-anchor="middle">6 tane 1 cm²</text><polygon points="440,245 575,245 575,350 440,350" fill="#62dcc3" fill-opacity="0.15" stroke="#62dcc3" stroke-width="3"/><polygon points="440,245 495,195 630,195 575,245" fill="#62dcc3" fill-opacity="0.15" stroke="#62dcc3" stroke-width="3"/><polygon points="575,245 630,195 630,300 575,350" fill="#62dcc3" fill-opacity="0.15" stroke="#62dcc3" stroke-width="3"/><text x="530" y="140" font-size="24" fill="#f4cb75" text-anchor="middle">3 × 2 × 4 = 24 cm³</text><text x="503" y="389" font-size="22" fill="#eef4f5" text-anchor="middle">3 cm</text><text x="647" y="281" font-size="20" fill="#eef4f5" text-anchor="middle">4 cm</text><text x="628" y="185" font-size="20" fill="#eef4f5" text-anchor="middle">2 cm</text><text x="360" y="462" font-size="25" fill="#eef4f5" text-anchor="middle">Birim kare yüzeyi, birim küp hacmi ölçer.</text></g></svg>
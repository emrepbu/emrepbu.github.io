<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc"><title id="title">Alanı koruyarak yeniden düzenlemek</title><desc id="desc">Paralelkenarın soldaki üçgeni sağa taşınır; taban ve dik yükseklik korunur.</desc><rect width="720" height="520" rx="20" fill="#0d1721"/><g font-family="Arial, sans-serif"><text x="360" y="44" font-size="27" fill="#eef4f5" text-anchor="middle">Alanı koruyarak yeniden düzenlemek</text><polygon points="75,235 285,235 345,115 135,115" fill="#62dcc3" fill-opacity="0.15" stroke="#62dcc3" stroke-width="3"/><line x1="135" y1="115" x2="135" y2="235" stroke="#f4cb75" stroke-width="3" stroke-dasharray="7 6"/><text x="195" y="278" font-size="23" fill="#eef4f5" text-anchor="middle">taban b</text><text x="153" y="180" font-size="24" fill="#f4cb75" text-anchor="middle">h</text><text x="365" y="194" font-size="38" fill="#eef4f5" text-anchor="middle">→</text><polygon points="425,115 635,115 635,235 425,235" fill="#62dcc3" fill-opacity="0.15" stroke="#62dcc3" stroke-width="3"/><polygon points="575,235 635,235 635,115" fill="#f4cb75" fill-opacity="0.15" stroke="#f4cb75" stroke-width="3"/><text x="530" y="278" font-size="20" fill="#eef4f5" text-anchor="middle">aynı taban, aynı yükseklik</text><text x="360" y="353" font-size="27" fill="#eef4f5" text-anchor="middle">Kesip taşıma alanı değiştirmez.</text><text x="360" y="408" font-size="32" fill="#62dcc3" text-anchor="middle">A = b × h</text></g></svg>
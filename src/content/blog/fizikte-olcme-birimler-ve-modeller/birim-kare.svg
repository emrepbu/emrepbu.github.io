6515e" stroke-width="3"/><line x1="284.5" y1="95" x2="284.5" y2="350" stroke="#36515e" stroke-width="3"/><line x1="55" y1="324.5" x2="310" y2="324.5" stroke="#36515e" stroke-width="3"/><text x="80" y="388" font-size="22" fill="#edf4f7">1 m = 100 cm</text><text x="360" y="150" font-size="22" fill="#edf4f7">1 m²</text><text x="360" y="210" font-size="22" fill="#edf4f7">= 100 cm × 100 cm</text><text x="360" y="270" font-size="22" fill="#edf4f7">= 10 000 cm²</text><text x="55" y="440" font-size="20" fill="#edf4f7">Kenar dönüşür; alan katsayının karesiyle dönüşür.</text></g></svg>
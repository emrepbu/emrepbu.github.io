<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Bir vektörü iki dik parçaya ayırmak</title><desc id="desc">4,1 vektörü 1,1 yönünde 2.5,2.5 izdüşümüne ve 1.5,-1.5 dik kalanına ayrılır.</desc><rect width="720" height="480" rx="20" fill="#0d1721"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><g font-family="Arial, sans-serif" fill="#eef4f5"><text x="30" y="40" font-size="25" fill="#eef4f5" text-anchor="start">Bir vektörü iki dik parçaya ayırmak</text><line x1="82.000" y1="370.000" x2="632.000" y2="370.000" stroke="#97aaba" stroke-width="2" marker-end="url(#arrow)"/><line x1="115.000" y1="403.000" x2="115.000" y2="62.000" stroke="#97aaba" stroke-width="2" marker-end="url(#arrow)"/><line x1="104.000" y1="381.000" x2="423.000" y2="62.000" stroke="#97aaba" stroke-width="2" stroke-dasharray="7 6"/><line x1="115.000" y1="370.000" x2="555.000" y2="260.000" stroke="#eef4f5" stroke-width="4" marker-end="url(#arrow)"/><line x1="115.000" y1="370.000" x2="390.000" y2="95.000" stroke="#62dcc3" stroke-width="5" marker-end="url(#arrow)"/><line x1="390.000" y1="95.000" x2="555.000" y2="260.000" stroke="#f4cb75" stroke-width="5" marker-end="url(#arrow)"/><text x="150" y="140" font-size="22" fill="#62dcc3" text-anchor="start">p = (2,5; 2,5)</text><text x="455" y="110" font-size="22" fill="#f4cb75" text-anchor="start">r = (1,5; −1,5)</text><text x="430" y="345" font-size="23" fill="#eef4f5" text-anchor="start">u = (4, 1)</text><text x="70" y="438" font-size="25" fill="#eef4f5" text-anchor="start">u = p + r;    p · r = 0</text></g></svg>
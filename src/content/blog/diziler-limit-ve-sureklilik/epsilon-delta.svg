<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Çıktı aralığına girmek</title><desc id="desc">f(x)=2x+1 için x 2 noktasına 0.25 uzaklıktan yakınsa çıktı 5 noktasına 0.5 uzaklıktan yakındır.</desc><rect width="720" height="480" rx="20" fill="#0d1721"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><g font-family="Arial, sans-serif" fill="#eef4f5"><text x="30" y="40" font-size="25" fill="#eef4f5" text-anchor="start">Çıktı aralığına girmek</text><polygon points="110.000,252.500 614.000,252.500 614.000,167.500 110.000,167.500" stroke="#62dcc3" fill="#153d3b" stroke-width="1"/><line x1="110.000" y1="380.000" x2="416.000" y2="91.000" stroke="#eef4f5" stroke-width="3"/><line x1="245.000" y1="380.000" x2="245.000" y2="252.500" stroke="#f4cb75" stroke-width="2" stroke-dasharray="7 6"/><line x1="335.000" y1="380.000" x2="335.000" y2="167.500" stroke="#f4cb75" stroke-width="2" stroke-dasharray="7 6"/><line x1="110.000" y1="380.000" x2="614.000" y2="380.000" stroke="#97aaba" stroke-width="2"/><line x1="110.000" y1="210.000" x2="614.000" y2="210.000" stroke="#97aaba" stroke-width="1" stroke-dasharray="7 6"/><text x="65" y="174.5" font-size="20" fill="#62dcc3" text-anchor="start">5,5</text><text x="70" y="216" font-size="21" fill="#eef4f5" text-anchor="start">5</text><text x="65" y="259.5" font-size="20" fill="#62dcc3" text-anchor="start">4,5</text><text x="245.0" y="414" font-size="20" fill="#f4cb75" text-anchor="middle">1,75</text><text x="290" y="414" font-size="20" fill="#f4cb75" text-anchor="middle">2</text><text x="335.0" y="414" font-size="20" fill="#f4cb75" text-anchor="middle">2,25</text><text x="455" y="110" font-size="26" fill="#62dcc3" text-anchor="start">ε = 0,5</text><text x="455" y="145" font-size="26" fill="#f4cb75" text-anchor="start">δ = 0,25</text><text x="360" y="455" font-size="25" fill="#eef4f5" text-anchor="middle">|f(x) − 5| = 2|x − 2|</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Yaklaşma değeri ile nokta değeri</title><desc id="desc">x artı 1 doğrusu üzerindeki 1,2 noktası boştur; iki yandan değerler 2 olur.</desc><rect width="720" height="480" rx="20" fill="#0d1721"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs><g font-family="Arial, sans-serif" fill="#eef4f5"><text x="30" y="40" font-size="25" fill="#eef4f5" text-anchor="start">Yaklaşma değeri ile nokta değeri</text><line x1="67.000" y1="385.000" x2="577.400" y2="385.000" stroke="#97aaba" stroke-width="2" marker-end="url(#arrow)"/><line x1="155.000" y1="411.400" x2="155.000" y2="68.200" stroke="#97aaba" stroke-width="2" marker-end="url(#arrow)"/><line x1="93.400" y1="358.600" x2="375.000" y2="77.000" stroke="#62dcc3" stroke-width="4"/><line x1="243.000" y1="385.000" x2="243.000" y2="209.000" stroke="#97aaba" stroke-width="2" stroke-dasharray="7 6"/><line x1="155.000" y1="209.000" x2="243.000" y2="209.000" stroke="#97aaba" stroke-width="2" stroke-dasharray="7 6"/><circle cx="243" cy="209" r="8" fill="#0d1721" stroke="#62dcc3" stroke-width="3"/><text x="238" y="415" font-size="21" fill="#eef4f5" text-anchor="start">1</text><text x="125" y="215" font-size="21" fill="#eef4f5" text-anchor="start">2</text><line x1="172.600" y1="279.400" x2="225.400" y2="226.600" stroke="#f4cb75" stroke-width="3" marker-end="url(#arrow)"/><line x1="322.200" y1="129.800" x2="260.600" y2="191.400" stroke="#f4cb75" stroke-width="3" marker-end="url(#arrow)"/><text x="450" y="160" font-size="24" fill="#eef4f5" text-anchor="start">f(1) tanımsız</text><text x="450" y="207" font-size="29" fill="#62dcc3" text-anchor="start">Limit = 2</text><text x="450" y="285" font-size="22" fill="#eef4f5" text-anchor="start">x ≠ 1 için</text><text x="450" y="322" font-size="24" fill="#eef4f5" text-anchor="start">f(x) = x + 1</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Sığ katkılar taşıyıcı üretme enerjisini değiştirir</title><desc id="desc">Donör düzeyi iletim kenarı altında, akseptör düzeyi valans kenarı üstündedir.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#16324b"/></marker></defs><rect width="960" height="560" fill="#fbfdff"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="48" fill="#16324b" font-size="27" text-anchor="start" font-weight="bold">Sığ katkılar taşıyıcı üretme enerjisini değiştirir</text><text x="245" y="105" fill="#176bb2" font-size="24" text-anchor="middle" font-weight="normal">Donör</text><text x="710" y="105" fill="#187b66" font-size="24" text-anchor="middle" font-weight="normal">Akseptör</text><rect x="80" y="125" width="340" height="60" fill="#e0eef8" opacity="1"/><rect x="80" y="390" width="340" height="60" fill="#d9eee7" opacity="1"/><line x1="80" y1="185" x2="420" y2="185" stroke="#176bb2" stroke-width="3"/><line x1="80" y1="390" x2="420" y2="390" stroke="#187b66" stroke-width="3"/><text x="88" y="165" fill="#176bb2" font-size="20" text-anchor="start" font-weight="normal">İletim bandı • Ec</text><text x="88" y="425" fill="#187b66" font-size="20" text-anchor="start" font-weight="normal">Valans bandı • Ev</text><rect x="540" y="125" width="340" height="60" fill="#e0eef8" opacity="1"/><rect x="540" y="390" width="340" height="60" fill="#d9eee7" opacity="1"/><line x1="540" y1="185" x2="880" y2="185" stroke="#176bb2" stroke-width="3"/><line x1="540" y1="390" x2="880" y2="390" stroke="#187b66" stroke-width="3"/><text x="548" y="165" fill="#176bb2" font-size="20" text-anchor="start" font-weight="normal">İletim bandı • Ec</text><text x="548" y="425" fill="#187b66" font-size="20" text-anchor="start" font-weight="normal">Valans bandı • Ev</text><line x1="130" y1="245" x2="360" y2="245" stroke="#a76a0a" stroke-width="3"/><text x="110" y="278" fill="#a76a0a" font-size="21" text-anchor="start" font-weight="normal">ED: sığ donör düzeyi</text><line x1="280" y1="238" x2="280" y2="192" stroke="#bd4835" stroke-width="3" marker-end="url(#arrow)"/><text x="90" y="330" fill="#16324b" font-size="21" text-anchor="start" font-weight="normal">Elektron verir → sabit D⁺</text><line x1="590" y1="330" x2="820" y2="330" stroke="#a76a0a" stroke-width="3"/><text x="580" y="305" fill="#a76a0a" font-size="21" text-anchor="start" font-weight="normal">EA: sığ akseptör düzeyi</text><line x1="740" y1="383" x2="740" y2="337" stroke="#bd4835" stroke-width="3" marker-end="url(#arrow)"/><text x="550" y="240" fill="#16324b" font-size="21" text-anchor="start" font-weight="normal">Elektron alır → sabit A⁻</text><text x="480" y="510" fill="#526b7b" font-size="21" text-anchor="middle" font-weight="normal">İyonlaşan katkı iyonu sabittir; elektron veya delik hareketlidir.</text></g></svg>
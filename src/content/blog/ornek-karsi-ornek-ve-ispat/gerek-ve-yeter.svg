<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Gerekli ve yeterli koşul</title><desc id="desc">Dörde bölünen tam sayılar çift tam sayıların bir alt kümesidir. Altı çift olup dört ile bölünmediğinden ters yön geçerli değildir.</desc><rect width="720" height="480" rx="18" fill="#0d1721"/><g font-family="Arial, Helvetica, sans-serif"><text x="360" y="45" font-size="30" fill="#eef4f5" text-anchor="middle">Dörde bölünmek ⇒ çift olmak</text><rect x="70" y="90" width="580" height="300" fill="#62dcc3" fill-opacity="0.06" stroke="#62dcc3" stroke-width="3"/><text x="360" y="130" font-size="28" fill="#62dcc3" text-anchor="middle">Çift tam sayılar</text><rect x="225" y="160" width="270" height="155" fill="#f4cb75" fill-opacity="0.12" stroke="#f4cb75" stroke-width="3"/><text x="360" y="198" font-size="25" fill="#f4cb75" text-anchor="middle">Dörde bölünenler</text><text x="360" y="251" font-size="24" fill="#f4cb75" text-anchor="middle">… −8, −4, 0, 4, 8 …</text><text x="360" y="355" font-size="25" fill="#62dcc3" text-anchor="middle">… −6, −2, 2, 6 …</text><text x="360" y="439" font-size="28" fill="#eef4f5" text-anchor="middle">6 çift; fakat dörde bölünmez.</text></g></svg>

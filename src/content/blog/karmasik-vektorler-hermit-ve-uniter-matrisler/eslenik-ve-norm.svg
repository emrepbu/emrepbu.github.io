<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Eşlenikle pozitif norm</title><desc id="desc">Bir ve i bileşenleri ayrı karmaşık düzlemlerde çizilir; modül kareleri bir artı bir eder.</desc><rect width="720" height="480" rx="18" fill="#0d1721"/><g font-family="system-ui,sans-serif" fill="#e4edf6" font-size="19"><text x="32" y="42" font-size="25" font-weight="700">Eşlenikle pozitif norm</text><text x="58" y="98" fill="#e4edf6" font-size="24">v = (1, i)ᵀ</text><line x1="105" y1="245" x2="305" y2="245" stroke="#33485c" stroke-width="2"/><line x1="205" y1="145" x2="205" y2="345" stroke="#33485c" stroke-width="2"/><path d="M205.000,245.000 L280.000,245.000" fill="none" stroke="#62d4c8" stroke-width="4"/><circle cx="280" cy="245" r="5" fill="#62d4c8"/><text x="105" y="380" fill="#62d4c8" font-size="19">Bileşen 1: 1</text><line x1="405" y1="245" x2="605" y2="245" stroke="#33485c" stroke-width="2"/><line x1="505" y1="145" x2="505" y2="345" stroke="#33485c" stroke-width="2"/><path d="M505.000,245.000 L505.000,170.000" fill="none" stroke="#ffbd69" stroke-width="4"/><circle cx="505" cy="170" r="5" fill="#ffbd69"/><text x="405" y="380" fill="#ffbd69" font-size="19">Bileşen 2: i</text><text x="146" y="440" fill="#e4edf6" font-size="25">‖v‖² = |1|² + |i|² = 2</text></g></svg>
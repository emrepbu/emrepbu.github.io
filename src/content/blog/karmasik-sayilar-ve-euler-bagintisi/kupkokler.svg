<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Bir sayının üç küpkökü</title><desc id="desc">Sekiz i sayısının küpkökleri yarıçapı iki olan çemberde 120 derece aralıklarla yer alır.</desc><rect width="720" height="480" rx="18" fill="#0d1721"/><g font-family="system-ui,sans-serif" fill="#e4edf6" font-size="19"><text x="32" y="42" font-size="25" font-weight="700">Bir sayının üç küpkökü</text><circle cx="355" cy="270" r="150" fill="none" stroke="#33485c" stroke-width="2"/><line x1="130" y1="270" x2="600" y2="270" stroke="#33485c" stroke-width="2"/><line x1="355" y1="85" x2="355" y2="445" stroke="#33485c" stroke-width="2"/><path d="M355.000,270.000 L484.904,195.000" fill="none" stroke="#62d4c8" stroke-width="3"/><circle cx="484.9038105676658" cy="195.0" r="5" fill="#ffbd69"/><text x="496.9038105676658" y="190.0" fill="#ffbd69" font-size="19">√3 + i</text><path d="M355.000,270.000 L225.096,195.000" fill="none" stroke="#62d4c8" stroke-width="3"/><circle cx="225.0961894323342" cy="195.0" r="5" fill="#ffbd69"/><text x="125.0961894323342" y="190.0" fill="#ffbd69" font-size="19">−√3 + i</text><path d="M355.000,270.000 L355.000,420.000" fill="none" stroke="#62d4c8" stroke-width="3"/><circle cx="355.0" cy="420.0" r="5" fill="#ffbd69"/><text x="367.0" y="424.0" fill="#ffbd69" font-size="19">−2i</text><text x="80" y="100" fill="#e4edf6" font-size="19">w³ = 8i</text><text x="80" y="132" fill="#e4edf6" font-size="19">|w| = 2</text></g></svg>
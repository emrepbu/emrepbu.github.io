<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Bir nokta, iki gösterim</title><desc id="desc">Üç artı iki i sayısı gerçek ve sanal bileşenleriyle ve merkezden uzaklığıyla çizilir.</desc><rect width="720" height="480" rx="18" fill="#0d1721"/><g font-family="system-ui,sans-serif" fill="#e4edf6" font-size="19"><text x="32" y="42" font-size="25" font-weight="700">Bir nokta, iki gösterim</text><line x1="100" y1="270" x2="655" y2="270" stroke="#33485c" stroke-width="2"/><line x1="340" y1="70" x2="340" y2="450" stroke="#33485c" stroke-width="2"/><path d="M340.000,270.000 L535.000,140.000" fill="none" stroke="#62d4c8" stroke-width="3"/><line x1="535" y1="270" x2="535" y2="140" stroke="#33485c" stroke-width="2"/><circle cx="535" cy="140" r="5" fill="#ffbd69"/><text x="520" y="120" fill="#62d4c8" font-size="19">z = 3 + 2i</text><text x="530" y="297" fill="#e4edf6" font-size="19">3</text><text x="313" y="146" fill="#e4edf6" font-size="19">2</text><text x="365" y="208" fill="#e4edf6" font-size="19">r = √13</text><text x="624" y="298" fill="#e4edf6" font-size="19">Re</text><text x="354" y="88" fill="#e4edf6" font-size="19">Im</text></g></svg>
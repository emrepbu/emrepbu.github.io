<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Matrisin koruduğu doğrultular</title><desc id="desc">Bir artı bir yönü üç kat uzar; bir eksi bir yönü sabit kalır.</desc><rect width="720" height="480" rx="18" fill="#0d1721"/><g font-family="system-ui,sans-serif" fill="#e4edf6" font-size="19"><text x="32" y="42" font-size="25" font-weight="700">Matrisin koruduğu doğrultular</text><line x1="80" y1="290" x2="650" y2="290" stroke="#33485c" stroke-width="2"/><line x1="315" y1="65" x2="315" y2="455" stroke="#33485c" stroke-width="2"/><path d="M315.000,290.000 L373.000,232.000" fill="none" stroke="#62d4c8" stroke-width="4"/><circle cx="373" cy="232" r="4" fill="#62d4c8"/><text x="385" y="252" fill="#62d4c8" font-size="19">v₊</text><path d="M315.000,290.000 L489.000,116.000" fill="none" stroke="#ffbd69" stroke-width="4"/><circle cx="489" cy="116" r="4" fill="#ffbd69"/><text x="501" y="104" fill="#ffbd69" font-size="19">Av₊ = 3v₊</text><path d="M315.000,290.000 L373.000,348.000" fill="none" stroke="#c397ed" stroke-width="4"/><circle cx="373" cy="348" r="4" fill="#c397ed"/><text x="385" y="373" fill="#c397ed" font-size="19">Av₋ = v₋</text><text x="80" y="92" fill="#e4edf6" font-size="22">A = [2 1; 1 2]</text></g></svg>
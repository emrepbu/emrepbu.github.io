<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">İki bağımsız normal mod</title><desc id="desc">İki bileşenin aynı ve zıt işaretli değişimleri farklı özdeğerlere karşılık gelir.</desc><rect width="720" height="480" rx="18" fill="#0d1721"/><g font-family="system-ui,sans-serif" fill="#e4edf6" font-size="19"><text x="32" y="42" font-size="25" font-weight="700">İki bağımsız normal mod</text><text x="55" y="104" fill="#62d4c8" font-size="24">Birlikte: (1, 1)</text><text x="395" y="104" fill="#ffbd69" font-size="24">Zıt: (1, −1)</text><circle cx="150" cy="230" r="16" fill="#62d4c8"/><circle cx="255" cy="230" r="16" fill="#62d4c8"/><circle cx="455" cy="230" r="16" fill="#ffbd69"/><circle cx="560" cy="320" r="16" fill="#ffbd69"/><line x1="150" y1="290" x2="150" y2="185" stroke="#62d4c8" stroke-width="4"/><line x1="255" y1="290" x2="255" y2="185" stroke="#62d4c8" stroke-width="4"/><line x1="455" y1="290" x2="455" y2="185" stroke="#ffbd69" stroke-width="4"/><line x1="560" y1="260" x2="560" y2="365" stroke="#ffbd69" stroke-width="4"/><text x="98" y="414" fill="#e4edf6" font-size="19">Özdeğer 1; sıklık 1</text><text x="397" y="414" fill="#e4edf6" font-size="19">Özdeğer 3; sıklık √3</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Gerçek örgü ve ters örgü</title><desc id="desc">Uzunluk ve ters uzunluk eksenlerinde a ve 2pi/a aralıkları.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#16324b"/></marker></defs><rect width="960" height="560" fill="#fbfdff"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="48" fill="#16324b" font-size="27" text-anchor="start" font-weight="bold">Gerçek örgü ve ters örgü</text><text x="48" y="100" fill="#16324b" font-size="23" text-anchor="start" font-weight="normal">Gerçek uzay: atom konumları</text><line x1="90" y1="185" x2="880" y2="185" stroke="#16324b" stroke-width="2" marker-end="url(#arrow)"/><text x="890" y="193" fill="#16324b" font-size="22" text-anchor="start" font-weight="normal">x</text><circle cx="170" cy="185" r="9" fill="#176bb2" stroke="none" stroke-width="3"/><text x="170" y="226" fill="#16324b" font-size="20" text-anchor="middle" font-weight="normal">-2a</text><circle cx="325" cy="185" r="9" fill="#176bb2" stroke="none" stroke-width="3"/><text x="325" y="226" fill="#16324b" font-size="20" text-anchor="middle" font-weight="normal">-1a</text><circle cx="480" cy="185" r="9" fill="#176bb2" stroke="none" stroke-width="3"/><text x="480" y="226" fill="#16324b" font-size="20" text-anchor="middle" font-weight="normal">0</text><circle cx="635" cy="185" r="9" fill="#176bb2" stroke="none" stroke-width="3"/><text x="635" y="226" fill="#16324b" font-size="20" text-anchor="middle" font-weight="normal">1a</text><circle cx="790" cy="185" r="9" fill="#176bb2" stroke="none" stroke-width="3"/><text x="790" y="226" fill="#16324b" font-size="20" text-anchor="middle" font-weight="normal">2a</text><line x1="480" y1="140" x2="635" y2="140" stroke="#a76a0a" stroke-width="3" marker-end="url(#arrow)"/><text x="558" y="126" fill="#a76a0a" font-size="22" text-anchor="middle" font-weight="normal">a</text><text x="48" y="302" fill="#16324b" font-size="23" text-anchor="start" font-weight="normal">Ters uzay: aynı fazı veren dalga vektörleri</text><rect x="402.5" y="338" width="155" height="110" fill="#e1f2eb" opacity="1"/><line x1="90" y1="385" x2="880" y2="385" stroke="#16324b" stroke-width="2" marker-end="url(#arrow)"/><text x="890" y="393" fill="#16324b" font-size="22" text-anchor="start" font-weight="normal">q</text><circle cx="170" cy="385" r="8" fill="#187b66" stroke="none" stroke-width="3"/><text x="170" y="426" fill="#16324b" font-size="20" text-anchor="middle" font-weight="normal">−4π/a</text><circle cx="325" cy="385" r="8" fill="#187b66" stroke="none" stroke-width="3"/><text x="325" y="426" fill="#16324b" font-size="20" text-anchor="middle" font-weight="normal">−2π/a</text><circle cx="480" cy="385" r="8" fill="#187b66" stroke="none" stroke-width="3"/><text x="480" y="426" fill="#16324b" font-size="20" text-anchor="middle" font-weight="normal">0</text><circle cx="635" cy="385" r="8" fill="#187b66" stroke="none" stroke-width="3"/><text x="635" y="426" fill="#16324b" font-size="20" text-anchor="middle" font-weight="normal">2π/a</text><circle cx="790" cy="385" r="8" fill="#187b66" stroke="none" stroke-width="3"/><text x="790" y="426" fill="#16324b" font-size="20" text-anchor="middle" font-weight="normal">4π/a</text><line x1="402.5" y1="338" x2="402.5" y2="448" stroke="#187b66" stroke-width="2" stroke-dasharray="5 5"/><line x1="557.5" y1="338" x2="557.5" y2="448" stroke="#187b66" stroke-width="2" stroke-dasharray="5 5"/><text x="480" y="485" fill="#187b66" font-size="23" text-anchor="middle" font-weight="normal">İlk bölge: −π/a ≤ q &lt; π/a</text><text x="480" y="527" fill="#526b7b" font-size="21" text-anchor="middle" font-weight="normal">a büyürse ters örgü adımı 2π/a küçülür.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">İki düzlemden gelen dalgaların yol farkı</title><desc id="desc">Paralel gelen ve çıkan ışınların alt düzlemdeki fazladan yol uzunluğu iki d sin theta katkısıdır.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#16324b"/></marker></defs><rect width="960" height="560" fill="#fbfdff"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="48" fill="#16324b" font-size="27" text-anchor="start" font-weight="bold">İki düzlemden gelen dalgaların yol farkı</text><line x1="115" y1="200" x2="865" y2="200" stroke="#526b7b" stroke-width="3"/><line x1="115" y1="340" x2="865" y2="340" stroke="#526b7b" stroke-width="3"/><text x="760" y="190" fill="#16324b" font-size="20" text-anchor="start" font-weight="normal">1. düzlem</text><text x="760" y="370" fill="#16324b" font-size="20" text-anchor="start" font-weight="normal">2. düzlem</text><line x1="220" y1="50" x2="480" y2="200" stroke="#176bb2" stroke-width="4" marker-end="url(#arrow)"/><line x1="480" y1="200" x2="740" y2="50" stroke="#176bb2" stroke-width="4" marker-end="url(#arrow)"/><line x1="220" y1="190" x2="480" y2="340" stroke="#187b66" stroke-width="4" marker-end="url(#arrow)"/><line x1="480" y1="340" x2="740" y2="190" stroke="#187b66" stroke-width="4" marker-end="url(#arrow)"/><line x1="480" y1="200" x2="419.38" y2="305" stroke="#526b7b" stroke-width="2" stroke-dasharray="5 5"/><line x1="480" y1="200" x2="540.62" y2="305" stroke="#526b7b" stroke-width="2" stroke-dasharray="5 5"/><line x1="419.38" y1="305" x2="480" y2="340" stroke="#a76a0a" stroke-width="7"/><line x1="480" y1="340" x2="540.62" y2="305" stroke="#a76a0a" stroke-width="7"/><line x1="170" y1="205" x2="170" y2="335" stroke="#16324b" stroke-width="2" marker-end="url(#arrow)"/><text x="148" y="277" fill="#16324b" font-size="24" text-anchor="start" font-weight="normal">d</text><text x="390" y="187" fill="#176bb2" font-size="24" text-anchor="start" font-weight="normal">θ</text><text x="541" y="187" fill="#176bb2" font-size="24" text-anchor="start" font-weight="normal">θ</text><text x="300" y="320" fill="#a76a0a" font-size="20" text-anchor="start" font-weight="normal">d sin θ</text><text x="570" y="320" fill="#a76a0a" font-size="20" text-anchor="start" font-weight="normal">d sin θ</text><text x="480" y="435" fill="#16324b" font-size="27" text-anchor="middle" font-weight="normal">Fazladan yol = 2d sin θ</text><text x="480" y="480" fill="#187b66" font-size="25" text-anchor="middle" font-weight="normal">Yapıcı girişim: 2d sin θ = nλ</text><text x="480" y="528" fill="#526b7b" font-size="21" text-anchor="middle" font-weight="normal">θ düzlemle ölçülür; saçılma açısı 2θ’dır.</text></g></svg>
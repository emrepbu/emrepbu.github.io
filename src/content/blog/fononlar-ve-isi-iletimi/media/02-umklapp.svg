<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Umklapp: ters örgü vektörüyle momentum hesabı</title><desc id="desc">Birinci bölge dışına çıkan 0,8G toplamı bir G çıkarılarak eksi0,2G değerine taşınır.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#16324b"/></marker></defs><rect width="960" height="560" fill="#fbfdff"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="48" fill="#16324b" font-size="27" text-anchor="start" font-weight="bold">Umklapp: ters örgü vektörüyle momentum hesabı</text><rect x="330" y="145" width="300" height="270" fill="#e1f2eb" opacity="1"/><line x1="145" y1="300" x2="850" y2="300" stroke="#16324b" stroke-width="2" marker-end="url(#arrow)"/><text x="866" y="308" fill="#16324b" font-size="24" text-anchor="start" font-weight="normal">q</text><line x1="330" y1="145" x2="330" y2="415" stroke="#187b66" stroke-width="2" stroke-dasharray="5 5"/><line x1="630" y1="145" x2="630" y2="415" stroke="#187b66" stroke-width="2" stroke-dasharray="5 5"/><text x="180" y="338" fill="#16324b" font-size="21" text-anchor="middle" font-weight="normal">−G</text><text x="330" y="338" fill="#16324b" font-size="21" text-anchor="middle" font-weight="normal">−G/2</text><text x="480" y="338" fill="#16324b" font-size="21" text-anchor="middle" font-weight="normal">0</text><text x="630" y="338" fill="#16324b" font-size="21" text-anchor="middle" font-weight="normal">G/2</text><text x="780" y="338" fill="#16324b" font-size="21" text-anchor="middle" font-weight="normal">G</text><line x1="480" y1="190" x2="600" y2="190" stroke="#176bb2" stroke-width="4" marker-end="url(#arrow)"/><line x1="600" y1="190" x2="720" y2="190" stroke="#bd4835" stroke-width="4" marker-end="url(#arrow)"/><text x="540" y="170" fill="#176bb2" font-size="20" text-anchor="middle" font-weight="normal">q₁ = 0,4G</text><text x="680" y="170" fill="#bd4835" font-size="20" text-anchor="middle" font-weight="normal">q₂ = 0,4G</text><line x1="720" y1="255" x2="420" y2="255" stroke="#a76a0a" stroke-width="4" marker-end="url(#arrow)"/><text x="570" y="241" fill="#a76a0a" font-size="21" text-anchor="middle" font-weight="normal">G çıkarılır</text><circle cx="420" cy="300" r="8" fill="#a76a0a" stroke="none" stroke-width="3"/><line x1="720" y1="195" x2="720" y2="300" stroke="#526b7b" stroke-width="1" stroke-dasharray="5 5"/><text x="720" y="372" fill="#bd4835" font-size="21" text-anchor="middle" font-weight="normal">Toplam: 0,8G</text><text x="420" y="408" fill="#a76a0a" font-size="22" text-anchor="middle" font-weight="normal">q₃ = −0,2G</text><text x="480" y="472" fill="#16324b" font-size="28" text-anchor="middle" font-weight="normal">q₁ + q₂ = q₃ + G</text><text x="480" y="520" fill="#526b7b" font-size="22" text-anchor="middle" font-weight="normal">Gerçek olay için ayrıca ω₁ + ω₂ = ω₃ gerekir.</text></g></svg>